<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能报告编辑器 · 方案D 双模式分屏</title>
<style>
/* ========== GDS Tokens ========== */
:root{
  --primary:#1a827f; --primary-hover:#339b98; --primary-active:#016966; --primary-bg:#eef4f4;
  --text-em:#21272a; --text:#343a3f; --text-2:#697077; --hint:#878d96; --disable:#a2a9b0;
  --bg:#f2f4f8; --alt:#ffffff; --selected:#eef4f4; --divide:#dde1e6; --outline:#cdd3da;
  --table-head:#f2f4f8;
  --info:#0f62fe; --info-bg:#edf5ff; --info-border:#a6c8ff;
  --success:#198038; --success-bg:#defbe6; --success-border:#a7f0ba;
  --warn:#8a6a00; --warn-border:#f1c21b; --warn-bg:#fcf4d6;
  --error:#da1e28; --error-bg:#fff1f1; --error-border:#ffd7d9;
  --purple:#6929c4; --purple-bg:#e8daff;
  --radius-s:2px; --radius-m:4px;
  --shadow-panel:0 2px 6px rgba(67,67,67,.06), 0 1px 5.2px rgba(68,68,68,.09);
  --shadow-pop:0 5px 12px 4px rgba(0,0,0,.04), 0 3px 6px rgba(0,0,0,.16), 0 1px 2px -2px rgba(0,0,0,.16);
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
/* 修复:#app 此前没有显式高度,#main 的 height:calc(100% - 52px) 就没有有效的百分比基准,
   一旦卡片内容变高(超过一屏)整份页面就会失控地一直往下长,而 body 又是 overflow:hidden——
   两侧分栏各自独立滚动的既有设计(#card-list / #paper-scroll 早已写了 overflow-y:auto)
   因此完全无法生效,内容超出视口的部分直接不可见也无法触达。这里只补一条不影响任何
   视觉样式的结构性高度声明,让分栏滚动按原设计工作。 */
#app{height:100%}
body{
  font-family:"Inter","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:12px;line-height:20px;color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{cursor:not-allowed}
input,textarea{font-family:inherit;color:var(--text)}
textarea{resize:vertical}
::selection{background:#b4e9e7}

/* ========== 顶栏 ========== */
#topbar{
  height:52px;background:var(--alt);border-bottom:1px solid var(--divide);
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:16px;position:relative;z-index:30;
}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:28px;height:28px;border-radius:var(--radius-m);background:linear-gradient(135deg,var(--primary),#0e5c5a);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.tb-titles{min-width:0}
#docname{
  border:1px solid transparent;border-radius:var(--radius-s);font-size:14px;font-weight:600;color:var(--text-em);
  padding:1px 6px;width:240px;background:transparent;transition:border-color .15s, background .15s;
}
#docname:hover{border-color:var(--outline)}
#docname:focus{outline:none;border-color:var(--primary);background:var(--alt)}
.tb-sub{font-size:10px;line-height:14px;color:var(--hint);padding-left:7px}
.tb-right{display:flex;align-items:center;gap:8px}
.tb-divider{width:1px;height:20px;background:var(--divide);margin:0 4px}
.tb-demo{display:inline-flex;align-items:center;gap:5px;padding:1px 4px 1px 1px;border:1px dashed var(--divide);border-radius:var(--radius-m);opacity:.72;transition:opacity .15s}
.tb-demo:hover{opacity:1}
.tb-demo-tag{display:inline-flex;align-items:center;height:16px;padding:0 6px;border-radius:100px;background:var(--bg);color:var(--hint);font-size:9px;font-weight:700;letter-spacing:.5px;flex:none;border:1px solid var(--divide)}
.tb-demo .btn{height:22px;padding:0 7px;font-size:10.5px;border-color:transparent;background:transparent;color:var(--text-2)}
.tb-demo .btn:hover:not(:disabled){background:var(--bg);color:var(--text);border-color:var(--divide)}
.tb-demo .btn svg{width:11px;height:11px}
.tb-save-hint{font-size:10px;color:var(--hint);white-space:nowrap;padding:0 2px}

.btn{
  display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 12px;border-radius:var(--radius-s);
  font-size:12px;border:1px solid var(--outline);background:var(--alt);color:var(--text);
  transition:all .15s;white-space:nowrap;
}
.btn:hover:not(:disabled){border-color:var(--primary-hover);color:var(--primary-hover)}
.btn:active:not(:disabled){border-color:var(--primary-active);color:var(--primary-active)}
.btn:disabled{color:var(--disable);border-color:var(--divide);background:var(--bg)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
.btn-primary:active:not(:disabled){background:var(--primary-active);border-color:var(--primary-active)}
.btn-primary:disabled{background:var(--divide);border-color:var(--divide);color:#fff}
.btn-text{border-color:transparent;background:transparent;color:var(--primary);padding:0 6px}
.btn-text:hover:not(:disabled){color:var(--primary-hover);background:var(--primary-bg);border-color:transparent}
.btn-text:disabled{color:var(--disable);background:transparent;border-color:transparent}
.btn-sm{height:24px;padding:0 8px;font-size:12px}
.btn .spin{margin-right:2px}

.v-chip{
  display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:100px;
  background:var(--bg);border:1px solid var(--divide);color:var(--text-2);font-size:10px;font-weight:600;margin-left:2px;
}
.chip-stale{
  display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:100px;
  background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn);font-size:12px;font-weight:500;
  animation:pulse-w 2s ease-in-out infinite;
}
.chip-stale:hover{filter:brightness(.97)}
@keyframes pulse-w{0%,100%{box-shadow:0 0 0 0 rgba(241,194,27,.35)}50%{box-shadow:0 0 0 4px rgba(241,194,27,0)}}

.seg{display:flex;background:var(--bg);border:1px solid var(--divide);border-radius:var(--radius-m);padding:2px;gap:2px}
.seg-btn{height:24px;padding:0 12px;border-radius:var(--radius-s);font-size:12px;color:var(--text-2);display:inline-flex;align-items:center;gap:5px;transition:all .15s}
.seg-btn:hover{color:var(--text-em)}
.seg-btn.on{background:var(--alt);color:var(--primary);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ========== 主体分屏 ========== */
#main{display:flex;height:calc(100% - 52px)}
#editor-pane{
  width:446px;flex:none;background:var(--bg);border-right:1px solid var(--divide);
  display:flex;flex-direction:column;transition:margin-left .25s ease,opacity .2s;
}
body.mode-read #editor-pane{margin-left:-446px;opacity:0;pointer-events:none}
.pane-head{
  height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;
  border-bottom:1px solid var(--divide);background:var(--alt);font-size:12px;color:var(--text-2);
}
.pane-head b{color:var(--text-em);font-weight:600;font-size:12px}
.pane-head .ph-hint{margin-left:auto;font-size:10px;color:var(--hint)}
#card-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 14px 40px}
#preview-pane{flex:1;display:flex;flex-direction:column;min-width:0;background:#e9ecf1}
#paper-scroll{flex:1;overflow-y:auto;padding:28px 40px 80px}
#paper{
  background:var(--alt);max-width:800px;margin:0 auto;min-height:calc(100% - 8px);
  box-shadow:0 1px 3px rgba(33,39,42,.10),0 8px 28px rgba(33,39,42,.10);
  border-radius:3px;padding:56px 64px 72px;position:relative;
}
body.mode-read #paper{max-width:860px;padding:64px 84px 88px}
#print-header{display:none}

/* ========== 左侧配置卡 ========== */
.cfg-card{
  background:var(--alt);border:1px solid var(--divide);border-left:3px solid var(--outline);
  border-radius:var(--radius-m);box-shadow:var(--shadow-panel);margin:2px 0;
  transition:border-color .15s, box-shadow .15s, opacity .15s;position:relative;
}
.cfg-card.t-static{border-left-color:#a2a9b0}
.cfg-card.t-sql{border-left-color:#00539a}
.cfg-card.t-insight{border-left-color:var(--purple)}
.cfg-card:hover{box-shadow:var(--shadow-pop)}
.cfg-card.peer-hover{border-color:var(--primary-hover)}
.cfg-card.selected{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary), var(--shadow-panel)}
/* flashEl() 也会给左侧配置卡加这个类(selectCard 从右向左联动时),需要与 .pv-block.flash
   等效的动画,否则左侧闪烁定位在视觉上完全没有效果。keyframes 见下方 flash-outline 定义。 */
.cfg-card.flash{animation:flash-outline 1s ease}
.cfg-card.dragging{opacity:.35}
.cfg-card.drop-before::before,.cfg-card.drop-after::after{
  content:"";position:absolute;left:8px;right:8px;height:3px;border-radius:2px;background:var(--primary);z-index:5;
}
.cfg-card.drop-before::before{top:-7px}
.cfg-card.drop-after::after{bottom:-7px}

.cfg-head{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 4px;min-height:38px}
.drag{color:var(--outline);cursor:grab;padding:2px 0 2px 4px;flex:none;display:flex}
.drag:hover{color:var(--hint)}
.drag:active{cursor:grabbing}
.type-ico{width:22px;height:22px;border-radius:var(--radius-m);display:flex;align-items:center;justify-content:center;flex:none}
.type-ico.t-static{background:#e4e7eb;color:#565f66}
.type-ico.t-sql{background:#d9edff;color:#00539a}
.type-ico.t-insight{background:var(--purple-bg);color:var(--purple)}
.title-input{
  flex:1;min-width:0;border:1px solid transparent;border-radius:var(--radius-s);
  font-size:13px;font-weight:600;color:var(--text-em);padding:2px 6px;background:transparent;transition:border-color .15s;
}
.title-input:hover{border-color:var(--outline)}
.title-input:focus{outline:none;border-color:var(--primary)}
.icon-btn{
  width:24px;height:24px;border-radius:var(--radius-s);display:inline-flex;align-items:center;justify-content:center;
  color:var(--hint);flex:none;transition:all .12s;
}
.icon-btn:hover{background:var(--bg);color:var(--text)}
.icon-btn.danger:hover{background:var(--error-bg);color:var(--error)}
.icon-btn .chev{transition:transform .18s}
.cfg-card.collapsed .icon-btn .chev{transform:rotate(-90deg)}
.cfg-sum{padding:0 12px 10px 36px;color:var(--hint);font-size:11px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cfg-body{border-top:1px solid var(--bg);padding:10px 12px 12px 12px}

.badge{
  display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:100px;
  font-size:10px;font-weight:600;flex:none;white-space:nowrap;border:1px solid transparent;
}
.badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.badge.s-unconfigured{background:var(--bg);color:var(--hint);border-color:var(--divide)}
.badge.s-previewable{background:var(--info-bg);color:var(--info);border-color:var(--info-border)}
.badge.s-previewing,.badge.s-generating{background:var(--info-bg);color:var(--info);border-color:var(--info-border)}
.badge.s-ready,.badge.s-done{background:var(--success-bg);color:var(--success);border-color:var(--success-border)}
.badge.s-stale{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-border);animation:pulse-w 2s infinite}
.badge.s-invalid{background:var(--error-bg);color:var(--error);border-color:var(--error-border)}
.badge.s-generatable{background:var(--info-bg);color:var(--info);border-color:var(--info-border)}

.fld{margin-bottom:10px}
.fld:last-child{margin-bottom:0}
.fld>label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.fld-hint{font-weight:400;color:var(--hint);font-size:10px}
.fld textarea,.fld input[type=text]{
  width:100%;border:1px solid var(--outline);border-radius:var(--radius-s);padding:6px 8px;font-size:12px;line-height:18px;
  background:var(--alt);transition:border-color .15s;
}
.fld textarea:hover,.fld input[type=text]:hover{border-color:var(--hint)}
.fld textarea:focus,.fld input[type=text]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(26,130,127,.12)}
textarea.code{font-family:var(--mono);font-size:11px;line-height:17px;background:#fbfcfd;color:#24504f;white-space:pre;overflow-x:auto}
.fld-row{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.fld-reason{font-size:10px;color:var(--hint)}
.mini-tag{display:inline-flex;height:16px;align-items:center;padding:0 6px;border-radius:100px;background:var(--warn-bg);color:var(--warn);font-size:10px;font-weight:600}

/* 查询列表 */
.q-item{
  display:flex;align-items:center;gap:6px;border:1px solid var(--divide);border-radius:var(--radius-s);
  padding:5px 6px;margin-bottom:5px;background:#fafbfc;transition:border-color .15s;
}
.q-item:hover{border-color:var(--outline)}
.q-item .q-ico{color:#00539a;flex:none;display:flex}
.q-name{font-weight:600;color:var(--text-em);white-space:nowrap;font-size:11px}
.q-sql{
  flex:1;min-width:0;font-family:var(--mono);font-size:10px;color:var(--hint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.q-add{
  width:100%;border:1px dashed var(--outline);border-radius:var(--radius-s);height:26px;
  color:var(--primary);font-size:11px;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .15s;background:transparent;
}
.q-add:hover{border-color:var(--primary);background:var(--primary-bg)}

/* 引用列表 */
.ref-item{
  display:flex;align-items:center;gap:7px;border:1px solid var(--divide);border-radius:var(--radius-s);
  padding:6px 8px;margin-bottom:5px;cursor:pointer;transition:all .15s;background:var(--alt);
}
.ref-item:hover{border-color:var(--outline)}
.ref-item.is-checked{border-color:var(--primary);background:var(--primary-bg)}
.ref-item.is-disabled{cursor:not-allowed;background:var(--bg);opacity:.75}
.ref-item.is-invalid{border-color:var(--error-border);background:var(--error-bg)}
.ref-item input{accent-color:var(--primary);flex:none}
.ref-name{font-weight:600;color:var(--text-em);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref-reason{margin-left:auto;font-size:10px;color:var(--hint);flex:none}
.ref-empty{font-size:11px;color:var(--hint);border:1px dashed var(--divide);border-radius:var(--radius-s);padding:8px;text-align:center}

/* 横幅 */
.banner{
  display:flex;align-items:flex-start;gap:7px;border-radius:var(--radius-s);padding:7px 9px;margin:10px 0 0;
  font-size:11px;line-height:16px;border:1px solid;
}
.banner .bn-ico{flex:none;margin-top:1px}
.banner .bn-body{flex:1}
.banner .bn-act{display:flex;gap:6px;margin-top:5px}
.banner.warn{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn)}
.banner.info{background:var(--info-bg);border-color:var(--info-border);color:#00419e}
.banner.error{background:var(--error-bg);border-color:var(--error-border);color:var(--error)}

.cfg-actions{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--divide)}
.cfg-meta{margin-left:auto;font-size:10px;color:var(--hint);text-align:right;line-height:14px}

/* 富文本工具条 */
.rt-toolbar{display:flex;gap:2px;border:1px solid var(--outline);border-bottom:none;border-radius:var(--radius-s) var(--radius-s) 0 0;background:#fafbfc;padding:3px}
.rt-btn{
  min-width:24px;height:22px;padding:0 6px;border-radius:var(--radius-s);font-size:11px;color:var(--text-2);
  display:inline-flex;align-items:center;justify-content:center;transition:all .12s;
}
.rt-btn:hover{background:var(--selected);color:var(--primary)}
.rt-btn b{font-weight:700}.rt-btn i{font-style:italic}.rt-btn u{text-decoration:underline}
.rt-sep{width:1px;background:var(--divide);margin:2px 3px}
.rich-editor{
  border:1px solid var(--outline);border-radius:0 0 var(--radius-s) var(--radius-s);min-height:72px;max-height:220px;overflow-y:auto;
  padding:8px 10px;font-size:12px;line-height:1.7;background:var(--alt);
}
.rich-editor:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(26,130,127,.12)}
.rich-editor h1{font-size:16px;line-height:1.5;margin:2px 0;color:var(--text-em)}
.rich-editor h2{font-size:14px;line-height:1.5;margin:2px 0;color:var(--text-em)}
.rich-editor p{margin:2px 0}
.rich-editor ul{padding-left:18px;margin:2px 0}

/* 插入区 */
.ins-zone{position:relative;height:14px;display:flex;align-items:center;justify-content:center;margin:0}
.ins-zone .ins-line{position:absolute;left:10px;right:10px;top:50%;height:1px;background:var(--primary);opacity:0;transition:opacity .15s}
.ins-btn{
  position:relative;z-index:2;width:18px;height:18px;border-radius:50%;background:var(--alt);border:1px solid var(--outline);
  color:var(--hint);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.8);transition:all .15s;
}
.ins-zone:hover .ins-btn,.ins-zone.open .ins-btn{opacity:1;transform:scale(1)}
.ins-zone:hover .ins-line,.ins-zone.open .ins-line{opacity:.5}
.ins-btn:hover,.ins-zone.open .ins-btn{background:var(--primary);border-color:var(--primary);color:#fff}
.ins-menu{
  display:none;position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:20;width:246px;
  background:var(--alt);border:1px solid var(--divide);border-radius:var(--radius-m);box-shadow:var(--shadow-pop);padding:4px;
}
.ins-zone.open .ins-menu{display:block;animation:menu-in .14s ease}
@keyframes menu-in{from{opacity:0;transform:translateX(-50%) translateY(-4px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.ins-zone .ins-menu.flip-up{top:auto;bottom:20px}
.ins-zone.open .ins-menu.flip-up{animation:menu-in-up .14s ease}
@keyframes menu-in-up{from{opacity:0;transform:translateX(-50%) translateY(4px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.ins-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:var(--radius-s);text-align:left;transition:background .12s}
.ins-item:hover{background:var(--selected)}
.ins-item .type-ico{width:26px;height:26px}
.ins-item b{display:block;font-size:12px;color:var(--text-em);line-height:16px}
.ins-item span{display:block;font-size:10px;color:var(--hint);line-height:14px}

.add-bar{display:flex;align-items:center;gap:6px;margin-top:6px;padding:0 2px;color:var(--hint);font-size:11px}
.add-bar .btn-sm{border-style:dashed}

/* 左侧空状态 */
.empty-left{padding:44px 26px;text-align:center}
.empty-left .e-ico{width:64px;height:64px;margin:0 auto 16px;border-radius:14px;background:var(--alt);border:1px solid var(--divide);display:flex;align-items:center;justify-content:center;color:var(--primary);box-shadow:var(--shadow-panel)}
.empty-left h3{font-size:15px;color:var(--text-em);margin-bottom:6px}
.empty-left p{color:var(--text-2);font-size:12px;line-height:19px;margin-bottom:16px}
.empty-types{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.empty-types .ins-item{border:1px solid var(--divide);background:var(--alt)}
.empty-types .ins-item:hover{border-color:var(--primary-hover);background:var(--selected)}
.empty-or{display:flex;align-items:center;gap:10px;color:var(--hint);font-size:10px;margin:10px 0 12px}
.empty-or::before,.empty-or::after{content:"";flex:1;height:1px;background:var(--divide)}

/* ========== 右侧成品预览 ========== */
.pv-block{position:relative;border-radius:var(--radius-s);margin:0 -14px;padding:6px 14px;transition:background .15s, box-shadow .15s}
body:not(.mode-read) .pv-block{cursor:pointer}
body:not(.mode-read) .pv-block.peer-hover{background:#f6f9f9}
body:not(.mode-read) .pv-block.selected{box-shadow:0 0 0 1.5px var(--primary);background:#f9fcfc}
.pv-block.flash{animation:flash-outline 1s ease}
@keyframes flash-outline{0%{box-shadow:0 0 0 3px rgba(26,130,127,.55)}100%{box-shadow:0 0 0 1.5px rgba(26,130,127,0)}}

.pv-static{font-size:14px;line-height:1.9;color:var(--text)}

.pv-static p{margin:6px 0}
.pv-static ul{padding-left:22px;margin:6px 0}
.pv-static .muted{color:var(--hint);font-size:12px}

.pv-block.pv-untouched .pv-static{color:var(--hint);font-style:italic}

.pv-caption{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:600;color:var(--text-em);margin:16px 0 8px;padding-left:9px;border-left:3px solid var(--primary);line-height:1.5}
.pv-qname{font-size:11px;color:var(--text-2);margin:10px 0 4px;font-weight:600}
.pv-meta{font-size:10px;color:var(--hint);margin-top:6px}
.pv-text{font-size:13.5px;line-height:1.9;color:var(--text);margin:8px 0 2px}

.rep-table{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0;border:1px solid var(--divide)}
.rep-table th{

.rep-table tr:hover td{background:#f7f9fb}
.rep-table td.num{font-variant-numeric:tabular-nums;text-align:right}
.rep-table .mono{font-family:var(--mono);font-size:11px}
.cell-bar{position:relative;display:inline-block;min-width:90px}
.cell-bar .bar{position:absolute;left:0;top:2px;bottom:2px;background:#b4e9e7;border-radius:1px;z-index:0}
.cell-bar span{position:relative;z-index:1;padding-left:4px;font-variant-numeric:tabular-nums}

.chip{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:100px;font-size:10px;font-weight:600}
.chip.lv-high{background:#ffd7d9;color:#a2191f}
.chip.lv-mid{background:#fff1c2;color:#8a6a00}
.chip.lv-low{background:#d0e2ff;color:#002d9c}
.chip.st-open{background:#ffd7d9;color:#a2191f}
.chip.st-doing{background:#d0e2ff;color:#00539a}
.chip.st-done{background:#a7f0ba;color:#0e6027}
.chip.st-ignore{background:#dde1e6;color:#565f66}

.pv-insight-box{background:var(--primary-bg);border-left:3px solid var(--primary);border-radius:var(--radius-s);padding:14px 18px;margin:14px 0 4px}

.ins-head b{font-size:12px;color:var(--primary-active);letter-spacing:1px}
.ins-src{font-size:10px;color:var(--hint);margin-left:auto}
.ins-text{font-size:13.5px;line-height:2;color:var(--text-em);margin:0}

.pv-flag{
  position:absolute;top:8px;right:10px;z-index:3;display:inline-flex;align-items:center;gap:4px;
  height:20px;padding:0 8px;border-radius:100px;font-size:10px;font-weight:600;

}
button.pv-flag:hover{filter:brightness(.96)}
.is-stale .stale-dim{opacity:.5;filter:grayscale(.35);transition:opacity .2s}

.pv-block.is-note{opacity:.92}

/* 中性提示(未配置/已修改但非"过期")— 与黄色过期口径区分,不计入顶栏过期数 */
.pv-note{
  position:absolute;top:8px;right:10px;z-index:3;display:inline-flex;align-items:center;gap:4px;

}
.pv-note.tone-info{background:var(--info-bg);border-color:var(--info-border);color:#00419e}
button.pv-note:hover{filter:brightness(.96)}

.pv-hint{
  position:absolute;left:14px;bottom:8px;z-index:4;background:var(--text-em);color:#fff;font-size:10px;

}
body:not(.mode-read) .pv-block:hover .pv-hint{opacity:.92}

.pv-placeholder{
  display:flex;align-items:center;gap:10px;border:1.5px dashed var(--outline);border-radius:var(--radius-m);

}
.pv-placeholder .type-ico{width:28px;height:28px}
.pv-placeholder b{display:block;font-size:12px;color:var(--text-2)}
.pv-placeholder span{font-size:11px}

.skel{background:linear-gradient(90deg,#eceff3 25%,#f7f8fa 37%,#eceff3 63%);background-size:400% 100%;animation:shimmer 1.2s infinite;border-radius:3px}

.skel-table .sk-row:last-child{border-bottom:none}
.skel-table .sk-row div{height:10px;flex:1}
.skel-table .sk-head{background:var(--table-head)}
.skel-line{height:11px;margin:9px 0}
.skel-note{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--info);margin-top:4px}

/* 右侧空报告 */
.paper-empty{text-align:center;padding:40px 0 20px;color:var(--hint)}
.paper-empty .ghost{margin:0 auto;border-radius:3px;background:#f0f2f5}
.paper-empty p{margin-top:26px;font-size:12px;line-height:20px}
.paper-empty .g1{width:55%;height:22px;margin-bottom:18px}
.paper-empty .g2{width:88%;height:10px;margin-bottom:10px}
.paper-empty .g3{width:80%;height:10px;margin-bottom:10px}
.paper-empty .g4{width:86%;height:10px;margin-bottom:26px}
.paper-empty .g5{width:100%;height:110px}

.spin{width:12px;height:12px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;flex:none}

.overlay{

.dialog{

}

.dlg-head{display:flex;align-items:center;padding:14px 18px 0;font-size:14px;font-weight:600;color:var(--text-em)}

.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px 16px}
.tpl-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tpl-chip{
  display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:100px;font-size:10px;

.tpl-chip:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
.tpl-chip code{font-family:var(--mono)}

.dep-list li{list-style:none;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--error);padding:2px 0}
.btn-danger{background:var(--error);border-color:var(--error);color:#fff}
.btn-danger:hover:not(:disabled){background:#f04b57;border-color:#f04b57;color:#fff}

/* ========== Toast ========== */
#toast-root{position:fixed;top:62px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{
  display:flex;align-items:center;gap:8px;background:var(--alt);border:1px solid var(--divide);
  border-radius:var(--radius-m);box-shadow:var(--shadow-pop);padding:9px 14px;font-size:12px;color:var(--text);
  animation:toast-in .2s ease;max-width:360px;
}
.toast.out{opacity:0;transform:translateX(12px);transition:all .25s}
@keyframes toast-in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
.toast .t-ico{flex:none;display:flex}
.toast.success .t-ico{color:var(--success)}
.toast.warning .t-ico{color:#d9a300}
.toast.info .t-ico{color:var(--info)}
.toast .btn-text{flex:none;height:20px}

/* ========== 打印 ========== */
@media print{
  body{overflow:visible;background:#fff}
  #topbar,#editor-pane,.pane-head,#toast-root,.pv-flag,.pv-note{display:none !important}
  #main{height:auto;display:block}
  #preview-pane{background:#fff;display:block}
  #paper-scroll{overflow:visible;padding:0}
  #paper{box-shadow:none;max-width:100%;padding:24px 8px;border-radius:0}
  #print-header{display:block;font-size:11px;color:#697077;margin:0 8px 10px;padding-bottom:6px;border-bottom:1px solid #dde1e6}
  .pv-placeholder,.skel-table,.skel-line,.skel-note,.pv-untouched{display:none !important}
  .pv-block{cursor:default;box-shadow:none !important;background:none !important}
  .is-stale .stale-dim{opacity:1;filter:none}
}
</style>

<script>
"use strict";
/* =====================================================
 * 智能报告编辑器 · 方案D 双模式分屏
 * 纯前端模拟:三类卡片 / SQL状态机 / AI脚本与洞见 / 依赖链

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => 'c' + Math.random().toString(36).slice(2, 9);
const pad2 = n => String(n).padStart(2, '0');
const fmtTime = () => { const d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function strHash(s){ let h = 0; for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; } return Math.abs(h); }
const pickN = (arr, n) => arr[((n % arr.length) + arr.length) % arr.length];

/* ---------- 图标 ---------- */
const I = {
  drag:'<svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="3" cy="3" r="1.4"/><circle cx="7" cy="3" r="1.4"/><circle cx="3" cy="8" r="1.4"/><circle cx="7" cy="8" r="1.4"/><circle cx="3" cy="13" r="1.4"/><circle cx="7" cy="13" r="1.4"/></svg>',
  text:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3.5h10M8 3.5V13M5.5 13h5"/></svg>',
  db:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="8" cy="3.5" rx="5.5" ry="2.2"/><path d="M2.5 3.5v9c0 1.2 2.5 2.2 5.5 2.2s5.5-1 5.5-2.2v-9M2.5 8c0 1.2 2.5 2.2 5.5 2.2S13.5 9.2 13.5 8"/></svg>',
  spark:'<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.2 9.7 6 14.5 7.8 9.7 9.5 8 14.3 6.3 9.5 1.5 7.8 6.3 6z"/><circle cx="13.2" cy="2.8" r="1.1"/></svg>',
  trash:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 4h11M5.5 4V2.8c0-.4.3-.8.8-.8h3.4c.5 0 .8.4.8.8V4M4 4l.7 9.2c0 .4.4.8.8.8h5c.4 0 .8-.4.8-.8L12 4M6.6 7v4M9.4 7v4"/></svg>',

  refresh:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 1.8v2.7h-2.7"/></svg>',
  play:'<svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.8v10.4c0 .6.7 1 1.2.7l8.2-5.2c.5-.3.5-1 0-1.3L5.2 2.1c-.5-.3-1.2 0-1.2.7z"/></svg>',
  warn:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 2 1.6 13.2h12.8L8 2z" stroke-linejoin="round"/><path d="M8 6.4v3.2M8 11.6v.05"/></svg>',
  check:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.2"/><path d="M5.2 8.2 7.2 10.2 10.8 6.2"/></svg>',
  clock:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6.2"/><path d="M8 4.8V8l2.3 1.6"/></svg>',
  print:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6V2.5h7V6M4.5 11.5H2.8V7c0-.6.4-1 1-1h8.4c.6 0 1 .4 1 1v4.5H11.5M4.5 9.5h7v4h-7z"/></svg>',
  book:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5C6.8 2.4 5 2 2.5 2v11c2.5 0 4.3.4 5.5 1.5C9.2 13.4 11 13 13.5 13V2C11 2 9.2 2.4 8 3.5zM8 3.5v11"/></svg>',
  pen:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11.3 2.2 13.8 4.7 5.5 13H3v-2.5z"/></svg>',

  close:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>',
  link:'<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6.5 9.5 9.5 6.5M7.8 4.4l1.5-1.5a2.6 2.6 0 0 1 3.8 3.8L11.6 8.2M8.2 11.6l-1.5 1.5a2.6 2.6 0 0 1-3.8-3.8l1.5-1.5"/></svg>',
  doc:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2.5H6.5a1.5 1.5 0 0 0-1.5 1.5v16a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V7.5z"/><path d="M14 2.5V7.5h5M8.5 12h7M8.5 15.5h7M8.5 8.5h2"/></svg>'
};
const typeIco = t => t === 'static' ? I.text : (t === 'sql' ? I.db : I.spark);
const TYPE_NAME = { static:'静态内容', sql:'SQL 动态内容', insight:'AI 智能洞见' };

/* ---------- Mock 数据 ---------- */
const EVENT_TYPES = ['暴力破解','SQL注入','异常登录','恶意软件','数据外传','端口扫描','钓鱼邮件','权限提升'];
const IP_PREFIX = ['45.153','185.220','103.56','91.240','172.104','10.20'];

function genEvents(seed){
  const r = mulberry32(seed);
  const rows = [];
  let minutes = Math.floor(r() * 90);
  for(let i = 0; i < 10; i++){
    minutes += 40 + Math.floor(r() * 400);
    const d = new Date(2026, 7, 12, 18, 24);
    d.setMinutes(d.getMinutes() - minutes);
    const type = EVENT_TYPES[Math.floor(r() * EVENT_TYPES.length)];
    const rv = r();
    const level = rv < 0.3 ? '高危' : (rv < 0.65 ? '中危' : '低危');
    const sv = r();
    const status = sv < 0.22 ? '未处置' : (sv < 0.48 ? '处置中' : (sv < 0.88 ? '已处置' : '已忽略'));
    const ip = IP_PREFIX[Math.floor(r() * IP_PREFIX.length)] + '.' + Math.floor(r()*255) + '.' + Math.floor(r()*255);
    rows.push({
      id: 'SEC-' + pad2(d.getMonth()+1) + pad2(d.getDate()) + '-' + (1000 + Math.floor(r()*9000)),
      time: pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()),
      type, level, ip, status
    });
  }
  return rows;
}
function genTrend(seed){
  const r = mulberry32(seed);
  const rows = [];
  for(let i = 0; i < 7; i++){
    const total = Math.round(22 + i * 3.4 + r() * 10);
    const high = Math.round(total * (0.16 + r() * 0.14));
    const handled = Math.round(total * (0.55 + r() * 0.35));
    rows.push({ date:'08-' + pad2(6 + i), total, high, handled });
  }
  return rows;
}
function eventStats(rows){
  const total = rows.length;
  const high = rows.filter(x => x.level === '高危').length;
  const mid = rows.filter(x => x.level === '中危').length;
  const cnt = {};
  rows.forEach(x => { cnt[x.type] = (cnt[x.type] || 0) + 1; });
  let topType = '-', topCount = 0;
  Object.keys(cnt).forEach(k => { if(cnt[k] > topCount){ topCount = cnt[k]; topType = k; } });
  const open = rows.filter(x => x.status === '未处置' || x.status === '处置中').length;
  const openHigh = rows.filter(x => (x.status === '未处置' || x.status === '处置中') && x.level === '高危').length;
  return { total, high, mid, topType, topCount, open, openHigh };
}
function trendStats(rows){
  const first = rows[0].total, last = rows[rows.length - 1].total;
  const pct = Math.round((last - first) / first * 100);
  let peak = 0, peakDate = '';
  rows.forEach(x => { if(x.total > peak){ peak = x.total; peakDate = x.date; } });
  const sum = rows.reduce((a, x) => a + x.total, 0);
  const dirWord = pct > 5 ? '呈上升趋势' : (pct < -5 ? '呈回落趋势' : '基本平稳');
  return { first, last, pct, peak, peakDate, sum, avg: Math.round(sum / rows.length), dirWord };
}

function sqlStatus(c){
  if(c.previewing) return 'previewing';
  if(!c.queries.length || !c.script) return 'unconfigured';
  if(!c.lastPreview) return 'previewable';
  if(c.configDirty) return 'stale';
  if(c.lastPreview.version < state.dataVersion) return 'stale';
  return 'ready';
}
function staleReason(c){ return c.configDirty ? 'config' : 'data'; }

function insightRefsInfo(c){
  const myIdx = cardIdx(c.id);
  return c.refIds.map(id => {
    const r = findCard(id);
    if(!r) return { id, missing:true };
    return { id, card:r, after: cardIdx(id) > myIdx, status: sqlStatus(r) };
  });
}
function insightStatus(c){
  if(c.generating) return 'generating';
  const infos = insightRefsInfo(c);
  const valid = infos.filter(x => !x.missing);
  if(!valid.length || !c.prompt.trim()) return 'unconfigured';
  if(valid.some(x => x.after)) return 'invalid';
  if(!c.output) return 'generatable';
  const stale = valid.some(x =>
    x.status !== 'ready' ||
    (x.card.lastPreview && c.genTs && x.card.lastPreview.ts > c.genTs)
  );
  return stale ? 'stale' : 'done';
}
function canGenerateInsight(c){
  if(!c.prompt.trim()) return { ok:false, reason:'请填写分析提示词' };
  const infos = insightRefsInfo(c);
  if(!infos.length) return { ok:false, reason:'请选择至少一张数据卡作为输入' };
  if(infos.some(x => x.missing)) return { ok:false, reason:'存在已被删除的引用,请重新选择' };
  if(infos.some(x => x.after)) return { ok:false, reason:'引用的卡片必须位于本卡之前' };
  const notReady = infos.filter(x => x.status !== 'ready');
  if(notReady.length) return { ok:false, reason:'引用的数据卡尚未就绪(需先运行取数)', upstream:true };
  return { ok:true };
}

function basisWantsText(basis){ return /总结|概述|文字|一句|说明|结论|描述/.test(basis); }
function basisWantsTable(basis){ return /表格|明细|列表|趋势|展示|排行/.test(basis) || !basisWantsText(basis); }

function genScriptFor(c){

      }
    } else {
      L.push(dn + ' = (');
      L.push('    ctx.query("' + q.name + '")');
      if(ds === 'events'){
        L.push('      .assign(发生时间=lambda d: pd.to_datetime(d["发生时间"]))');
        L.push('      .sort_values("发生时间", ascending=False)');
      } else {
        L.push('      .sort_values("日期")');
        L.push('      .assign(处置率=lambda d: (d["已处置"] / d["事件总数"]).round(2))');
      }
      L.push('      .reset_index(drop=True)');
      L.push(')');
    }
    if(wantsTable){
      L.push('render.table(' + dn + (v % 2 === 0 ? '.head(50)' : '') + ', caption="' + q.name + '")');
    }
  });
  if(wantsText && c.queries.length){
    const dn = names[0];
    const ds = queryDataset(c.queries[0]);
    L.push('');
    L.push('# 文字结论');
    if(ds === 'events'){
      L.push('total = len(' + dn + ')');
      L.push('high  = int((' + dn + '["威胁等级"] == "高危").sum())');
      L.push('render.text(f"本期共 {total} 起安全事件,其中高危 {high} 起,请重点跟进未处置项。")');
    } else {
      L.push('delta = int(' + dn + '["事件总数"].iloc[-1] - ' + dn + '["事件总数"].iloc[0])');
      L.push('render.text(f"近 7 日事件量变化 {delta:+d} 起,整体走势详见上表。")');
    }
  }
  return L.join('\n');
}

/* ---------- AI 洞见(模拟) ---------- */
/* 解析提示词中的字数约束,如“100个字”“150字以内” */
function parseWordLimit(prompt){
  const m = String(prompt || '').match(/(\d{1,4})\s*个?字/);
  return m ? parseInt(m[1], 10) : null;
}
/* 按字数上限收尾,尽量落在句读处,不做生硬截断 */
function clampToLength(text, limit){
  if(!limit || text.length <= limit) return text;
  let cut = text.slice(0, limit);
  const lastPunct = Math.max(cut.lastIndexOf('。'), cut.lastIndexOf(';'), cut.lastIndexOf(','));
  if(lastPunct > limit * 0.5) return cut.slice(0, lastPunct + 1);
  return cut.replace(/[,;、]$/, '') + '…';
}
function composeInsight(c){
  const refs = c.refIds.map(findCard).filter(Boolean);
  let ev = null, tr = null;
  refs.forEach(r => {
    (r.lastPreview ? r.lastPreview.snapshots : []).forEach(s => {
      if(s.kind === 'events' && !ev) ev = eventStats(s.rows);
      if(s.kind === 'trend' && !tr) tr = trendStats(s.rows);
    });
  });
  const prompt = c.prompt || '';
  const limit = parseWordLimit(prompt);
  if(!ev && !tr){
    return clampToLength('所引用数据暂未包含可分析的记录,请检查上游查询后重新生成。', limit);
  }
  const n = c.genCount || 0;
  const lead = pickN(['综合本期取数结果,', '从最新数据看,', '整体研判,'], n);

  /* 按提示词中的关键词组织结论结构;未命中任何关键词时,默认输出全部维度 */
  const wantSummary = /总结|概述|摘要/.test(prompt);
  const wantTrend = /趋势|变化|走势/.test(prompt);
  const wantRisk = /风险|隐患|异常/.test(prompt);
  const wantAdvice = /建议|措施|处置|行动/.test(prompt);
  const useAll = !(wantSummary || wantTrend || wantRisk || wantAdvice);

  const segments = [];
  if((useAll || wantSummary || wantTrend) && tr){
    segments.push(lead + '近 7 日共发生安全事件 ' + tr.sum + ' 起(日均 ' + tr.avg + ' 起),事件量' + tr.dirWord + (tr.pct ? '约 ' + Math.abs(tr.pct) + '%' : '') + ',峰值出现在 ' + tr.peakDate + '(' + tr.peak + ' 起)');
  }
  if((useAll || wantSummary || wantRisk) && ev){
    const pre = segments.length ? '明细层面,' : lead;
    segments.push(pre + '抽样明细中高危事件 ' + ev.high + ' 起(占 ' + Math.round(ev.high / ev.total * 100) + '%),以「' + ev.topType + '」最为集中(' + ev.topCount + ' 起)');
    if(ev.open) segments.push('尚有 ' + ev.open + ' 起未完成闭环' + (ev.openHigh ? ',其中高危 ' + ev.openHigh + ' 起' : ''));
  }
  let text = segments.join(';');
  if(text) text += '。';

  if(useAll || wantAdvice || wantRisk){
    let risk;
    if(ev){
      risk = pickN([
        '最需关注:「' + ev.topType + '」类攻击持续活跃' + (ev.openHigh ? '且存在 ' + ev.openHigh + ' 起未处置高危事件' : '') + ',建议 24 小时内完成处置并复核来源 IP 封禁策略。',
        '建议优先闭环未处置高危事件,并针对「' + ev.topType + '」加强边界策略与告警收敛。',
        '风险点集中在「' + ev.topType + '」,建议扩大关联 IP 段封禁范围并在 24 小时内完成高危项复盘。'
      ], n);
    } else {
      risk = '建议持续关注事件量走势,完善告警闭环流程。';
    }
    text += risk;
  }
  if(!text) text = tr ? (lead + '近 7 日共发生安全事件 ' + tr.sum + ' 起,日均 ' + tr.avg + ' 起。') : '本期暂无可归纳的结论。';

  return clampToLength(text, limit);
}

function isStaleLike(c){

  '</div>';
}
function genScriptBtnLabel(c){
  if(c.genScriptBusy) return '<span class="spin ' + (c.script ? 'teal' : '') + '"></span>AI 生成中…';
  return I.spark + (c.script ? ' 重新生成脚本' : ' AI 生成脚本');
}
function scriptRows(c){
  const n = c.script ? c.script.split('\n').length + 1 : 3;
  return Math.min(13, Math.max(3, n));
}
function previewBtnLabel(st){
  if(st === 'previewing') return '<span class="spin"></span>取数中…';
  if(st === 'ready' || st === 'stale') return I.refresh + ' 重新运行取数';
  return I.play + ' 运行取数';
}
function previewMeta(c){
  return c.lastPreview
    ? '上次取数 ' + c.lastPreview.at + ' · 数据 v' + c.lastPreview.version + '<br>每次运行均实时取数'
    : '每次运行均实时取数';
}
function sqlBannerText(c){
  return staleReason(c) === 'config'
    ? '配置已变更,当前取数结果与最新配置不一致。'
    : '数据源已更新至 v' + state.dataVersion + ',当前取数结果基于 v' + (c.lastPreview ? c.lastPreview.version : '?') + ',已过期。';
}
function refRowReason(rst, after){
  if(after) return '位于本卡之后,不可引用';
  if(rst === 'unconfigured') return '未配置,不可引用';
  if(rst === 'previewable') return '尚未取数,请先运行取数';
  if(rst === 'previewing') return '取数中…';
  if(rst === 'stale') return '已过期,需重新取数';
  return '';
}
function refRowHtml(c, r){
  const myIdx = cardIdx(c.id), rIdx = cardIdx(r.id);
  const rst = sqlStatus(r);
  const checked = c.refIds.includes(r.id);
  const after = rIdx > myIdx;
  const reason = refRowReason(rst, after);
  const disabled = !checked && (after || rst !== 'ready');
  const cls = 'ref-item' + (checked ? ' is-checked' : '') + (disabled ? ' is-disabled' : '') + ((checked && after) ? ' is-invalid' : '');
  return '<label class="' + cls + '" title="' + esc(reason) + '">' +
    '<input type="checkbox" data-refid="' + r.id + '" ' + (checked ? 'checked' : '') + (disabled ? ' disabled' : '') + '>' +
    '<span class="q-ico" style="color:#00539a;display:flex">' + I.db + '</span>' +
    '<span class="ref-name" data-ref-name-of="' + r.id + '">' + esc(r.title || '未命名卡片') + '</span>' +
    badge(rst) +
    '<span class="ref-reason" style="' + (reason ? '' : 'display:none') + '">' + esc(reason) + '</span>' +
  '</label>';
}

function cfgSqlBody(c){
  const st = sqlStatus(c);
  let h = '';
  /* 查询 */
  h += '<div class="fld"><label>数据查询 <span class="fld-hint">可绑定多个查询到同一张卡</span></label>' +
    '<div data-role="query-list">' + c.queries.map(queryItemHtml).join('') + '</div>' +
    '<button class="q-add" data-act="q-new">' + I.plus + '新建 SQL 查询</button></div>';
  /* 脚本依据 */
  const canGen = c.queries.length > 0 && c.basis.trim().length > 0 && !c.genScriptBusy;
  h += '<div class="fld"><label>脚本依据 <span class="fld-hint">自然语言,AI 据此生成 pandas 渲染脚本</span></label>' +
    '<textarea data-bind="basis" rows="2" placeholder="例:用表格展示安全事件明细,按时间倒序">' + esc(c.basis) + '</textarea>' +
    '<div class="fld-row">' +
      '<button class="btn btn-sm ' + (c.script ? '' : 'btn-primary') + '" data-act="gen-script" data-role="gen-script-btn" ' + (canGen ? '' : 'disabled') + '>' + genScriptBtnLabel(c) + '</button>' +
      '<span class="fld-reason" data-role="gen-script-reason" style="' + ((!canGen && !c.genScriptBusy) ? '' : 'display:none') + '">' + esc(c.queries.length ? '请先填写脚本依据' : '请先绑定查询') + '</span>' +
      '<span class="mini-tag" data-role="gen-script-tag" style="' + ((c.script && c.scriptEdited) ? '' : 'display:none') + '">已手动编辑</span>' +
    '</div></div>';
  /* 脚本(item7:常驻可编辑,允许手写,不再依赖 AI 生成才出现) */
  /* item5/item3:焦点在脚本框内时收到的 AI 生成结果不会静默写入 state/DOM——常驻这条小
     提示条,且只有显式点击「应用」才会真正生效(不再有失焦自动应用的路径),避免
     "取数跑的是看不见的脚本",也避免静默应用覆盖用户挂起期间的手动修改。
     文案不点名"正在编辑中"这类具体触发原因——pending 是否出现取决于点按钮那一刻
     焦点是否还停留在脚本框内,这在不同浏览器下的时机不一致(如 Chromium 点按钮会
     先转移焦点),文案用中性表述只陈述事实,不依赖"何时/为何出现"。 */
  h += '<div class="banner info" data-role="script-pending" style="' + (c.pendingScript ? '' : 'display:none') + '">' +
    '<span class="bn-ico">' + I.spark + '</span><div class="bn-body"><span data-role="script-pending-text">AI 已生成新脚本' + (c.pendingScriptVer ? '(v' + c.pendingScriptVer + ')' : '') + ',尚未写入脚本框,点击「应用」后生效。</span>' +
      '<div class="bn-act"><button class="btn btn-sm btn-primary" data-act="apply-pending-script">' + I.check + ' 应用</button></div></div></div>';
  h += '<div class="fld"><label>渲染脚本 <span class="fld-hint">Python · pandas,可手写或由 AI 生成后直接编辑</span></label>' +
    '<textarea class="code" data-bind="script" data-role="script-ta" rows="' + scriptRows(c) + '" spellcheck="false" placeholder="可手写脚本,或点击上方「AI 生成脚本」&#10;可用 API:ctx.query(&#39;查询名&#39;) · render.table(df) · render.text(str)">' + esc(c.script) + '</textarea></div>';
  /* 过期横幅(常驻节点,display 控制可见性,避免替换节点打断正在进行的点击) */
  h += '<div class="banner warn" data-role="sql-banner" style="' + (st === 'stale' ? '' : 'display:none') + '">' +
    '<span class="bn-ico">' + I.warn + '</span><div class="bn-body"><span data-role="sql-banner-text">' + sqlBannerText(c) + '</span>' +
    '<div class="bn-act"><button class="btn btn-sm btn-primary" data-act="preview">' + I.refresh + ' 重新运行取数</button></div></div></div>';
  /* 动作区 */
  const disabled = (st === 'unconfigured' || st === 'previewing');
  h += '<div class="cfg-actions">' +
    '<button class="btn btn-sm btn-primary" data-act="preview" data-role="preview-btn" ' + (disabled ? 'disabled' : '') + '>' + previewBtnLabel(st) + '</button>' +
    '<span class="fld-reason" data-role="preview-reason" style="' + (st === 'unconfigured' ? '' : 'display:none') + '">绑定查询并准备好脚本(AI 生成或手写)后可运行取数</span>' +
    '<span class="cfg-meta" data-role="preview-meta">' + previewMeta(c) + '</span>' +
  '</div>';
  return '<div class="cfg-body">' + h + '</div>';
}

function cfgInsightBody(c){
  const st = insightStatus(c);
  let h = '';
  /* 引用 */
  h += '<div class="fld"><label>引用数据卡片 <span class="fld-hint">仅「已就绪」的动态内容可选</span></label>';
  const sqlCards = state.cards.filter(x => x.type === 'sql');
  if(!sqlCards.length){
    h += '<div class="ref-empty">报告中还没有 SQL 动态内容卡,先在上方添加一张吧</div>';
  } else {
    h += sqlCards.map(r => refRowHtml(c, r)).join('');
  }
  h += '</div>';
  /* 提示词 */
  h += '<div class="fld"><label>分析提示词</label>' +
    '<textarea data-bind="prompt" rows="2" placeholder="例:用100个字总结一下数据,指出最需关注的风险">' + esc(c.prompt) + '</textarea></div>';
  /* 横幅(四种互斥场景均预先渲染为常驻节点,用 display 切换,避免替换节点打断正在进行的点击) */
  const gen = canGenerateInsight(c);
  h += '<div class="banner error" data-role="ib-broken" style="' + (c.brokenNote ? '' : 'display:none') + '">' +
    '<span class="bn-ico">' + I.warn + '</span><div class="bn-body"><span data-role="ib-broken-text">' + esc(c.brokenNote || '') + '</span>,请重新选择数据来源并重新生成。</div></div>';
  h += '<div class="banner error" data-role="ib-invalid" style="' + ((st === 'invalid' && !c.brokenNote) ? '' : 'display:none') + '">' +
    '<span class="bn-ico">' + I.warn + '</span><div class="bn-body">存在位于本卡之后的引用。洞见只能引用其上方的数据卡,请调整卡片顺序或更换引用。</div></div>';
  h += '<div class="banner warn" data-role="ib-stale" style="' + (st === 'stale' ? '' : 'display:none') + '">' +
    '<span class="bn-ico">' + I.warn + '</span><div class="bn-body">上游数据卡已更新或过期,当前结论基于旧数据。' +
      '<div class="bn-act"><button class="btn btn-sm btn-primary" data-role="ib-stale-btn" data-act="' + (gen.ok ? 'gen-insight' : 'refresh-upstream') + '">' + I.refresh + (gen.ok ? ' 重新生成' : ' 刷新上游并重新生成') + '</button></div></div></div>';
  h += '<div class="banner info" data-role="ib-dirty" style="' + ((st !== 'stale' && c.dirty && c.output && st !== 'generating') ? '' : 'display:none') + '">' +
    '<span class="bn-ico">' + I.warn + '</span><div class="bn-body">引用或提示词已修改,当前结论可能不匹配,建议重新生成。</div></div>';
  /* 动作区 */
  let btnLabel;
  if(st === 'generating') btnLabel = '<span class="spin"></span>AI 分析中…';
  else if(c.output) btnLabel = I.spark + ' 重新生成洞见';
  else btnLabel = I.spark + ' 生成洞见';
  h += '<div class="cfg-actions">' +
    '<button class="btn btn-sm btn-primary" data-act="gen-insight" data-role="gen-insight-btn" ' + ((gen.ok && st !== 'generating') ? '' : 'disabled') + '>' + btnLabel + '</button>' +
    '<span class="fld-reason" data-role="gen-insight-reason" style="' + ((!gen.ok && st !== 'generating') ? '' : 'display:none') + '">' + esc(gen.reason || '') + '</span>' +
    '<span class="cfg-meta" data-role="gen-insight-meta" style="' + (c.output ? '' : 'display:none') + '">上次生成 ' + (c.genAt || '') + ' · 数据 v' + (c.genVersion || 0) + '</span>' +
  '</div>';
  return '<div class="cfg-body">' + h + '</div>';
}

function cfgSummary(c){
  if(c.type === 'static'){
    const t = c.html.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
    return t ? t.slice(0, 42) : '(空白文本)';
  }
  if(c.type === 'sql') return c.queries.length + ' 个查询 · ' + (c.script ? '脚本已生成' : '未生成脚本');
  return '引用 ' + c.refIds.length + ' 张数据卡' + (c.output ? ' · 已生成结论' : '');
}

function cfgCard(c){
  const sel = state.selectedId === c.id ? ' selected' : '';
  const col = c.collapsed ? ' collapsed' : '';
  let bg = '';
  if(c.type === 'sql') bg = badge(sqlStatus(c));
  if(c.type === 'insight') bg = badge(insightStatus(c));
  let body;
  if(c.collapsed) body = '<div class="cfg-sum">' + esc(cfgSummary(c)) + '</div>';
  else if(c.type === 'static') body = '<div class="cfg-body">' + cfgStaticBody(c) + '</div>';
  else if(c.type === 'sql') body = cfgSqlBody(c);
  else body = cfgInsightBody(c);
  return '<div class="cfg-card t-' + c.type + sel + col + '" data-card-id="' + c.id + '">' +
    '<div class="cfg-head">' +
      '<span class="drag" title="按住拖拽排序">' + I.drag + '</span>' +
      '<span class="type-ico t-' + c.type + '" title="' + TYPE_NAME[c.type] + '">' + typeIco(c.type) + '</span>' +
      '<input class="title-input" value="' + esc(c.title) + '" placeholder="卡片名称" spellcheck="false">' +
      bg +
      '<button class="icon-btn" data-act="collapse" title="' + (c.collapsed ? '展开配置' : '收起配置') + '">' + I.chev + '</button>' +
      '<button class="icon-btn danger" data-act="del-card" title="删除卡片">' + I.trash + '</button>' +
    '</div>' + body +
  '</div>';
}

/* =====================================================
 * 细粒度局部更新(根因修复)
 * ---------------------------------------------------
 * 旧实现里 change 事件会用 scheduleRender() 把整卡列表的重建推迟到
 * "下一次 click 事件结束后"才执行——但这类 change 恰恰是由另一个控件的
 * mousedown 抢焦点触发的(输入框失焦),也就是说重建会发生在
 * 该控件 mousedown 与 mouseup 之间。一旦重建把用户正要点击的按钮/复选框
 * 换成了新的 DOM 节点,浏览器就不会为这次 mousedown+mouseup 合成 click——
 * 点击/勾选被整个吞掉,这正是上一轮的核心回归。
 *
 * 根治方式:input/change 一律不再整卡重建,只在"徽章/横幅/按钮态/提示条"
 * 这些不会被用户直接点按的节点上做原地属性/文本/display 更新;所有可点击
 * 控件(按钮、复选框、文本框)在整个交互期间必须是同一个 DOM 引用。
 * ===================================================== */
function patchBadge(cardEl, st){
  const el = cardEl.querySelector('.cfg-head > .badge');
  if(!el) return;
  el.className = 'badge s-' + st;
  el.innerHTML = badgeInner(st);
}
function updateGenScriptRow(cardEl, c){
  const canGen = c.queries.length > 0 && c.basis.trim().length > 0 && !c.genScriptBusy;
  const btn = cardEl.querySelector('[data-role="gen-script-btn"]');
  if(btn){
    btn.disabled = !canGen;
    btn.classList.toggle('btn-primary', !c.script);
    btn.innerHTML = genScriptBtnLabel(c);
  }
  const reason = cardEl.querySelector('[data-role="gen-script-reason"]');
  if(reason){
    const show = !canGen && !c.genScriptBusy;
    reason.style.display = show ? '' : 'none';
    reason.textContent = c.queries.length ? '请先填写脚本依据' : '请先绑定查询';
  }
  const tag = cardEl.querySelector('[data-role="gen-script-tag"]');
  if(tag) tag.style.display = (c.script && c.scriptEdited) ? '' : 'none';
}
function updateSqlBanner(cardEl, c, st){
  const banner = cardEl.querySelector('[data-role="sql-banner"]');
  if(!banner) return;
  banner.style.display = st === 'stale' ? '' : 'none';
  if(st === 'stale'){
    const span = banner.querySelector('[data-role="sql-banner-text"]');
    if(span) span.textContent = sqlBannerText(c);
  }
}
function updateSqlActions(cardEl, c, st){
  const disabled = (st === 'unconfigured' || st === 'previewing');
  const btn = cardEl.querySelector('[data-role="preview-btn"]');
  if(btn){ btn.disabled = disabled; btn.innerHTML = previewBtnLabel(st); }
  const reason = cardEl.querySelector('[data-role="preview-reason"]');
  if(reason) reason.style.display = st === 'unconfigured' ? '' : 'none';
  const meta = cardEl.querySelector('[data-role="preview-meta"]');
  if(meta) meta.innerHTML = previewMeta(c);
}
/* item5:脚本框上方的"AI 已生成新脚本 · 应用"小条——仅在有待应用脚本时出现,只改这一处的
 * display/文本,绝不触碰脚本文本框本身的值(那正是它存在的意义:焦点在框内时不静默改值)。 */
function updateScriptPendingBar(cardEl, c){
  const bar = cardEl.querySelector('[data-role="script-pending"]');
  if(!bar) return;
  const show = !!c.pendingScript;
  bar.style.display = show ? '' : 'none';
  if(show){
    const t = bar.querySelector('[data-role="script-pending-text"]');
    if(t) t.textContent = 'AI 已生成新脚本' + (c.pendingScriptVer ? '(v' + c.pendingScriptVer + ')' : '') + ',尚未写入脚本框,点击「应用」后生效。';
  }
}
/* SQL 卡:刷新徽章/脚本依据行/待应用脚本条/过期横幅/动作区。不触碰查询列表与脚本文本框的值。 */
function patchSqlChrome(id){
  const c = findCard(id);
  const cardEl = $('#card-list [data-card-id="' + id + '"]');
  if(!c || !cardEl) return;
  const st = sqlStatus(c);
  patchBadge(cardEl, st);
  if(cardEl.classList.contains('collapsed')){
    const sum = cardEl.querySelector('.cfg-sum');
    if(sum) sum.textContent = cfgSummary(c);
    return;
  }
  updateGenScriptRow(cardEl, c);
  updateScriptPendingBar(cardEl, c);
  updateSqlBanner(cardEl, c, st);
  updateSqlActions(cardEl, c, st);
}

function updateInsightBanners(cardEl, c, st, gen){
  const broken = cardEl.querySelector('[data-role="ib-broken"]');
  if(broken){
    broken.style.display = c.brokenNote ? '' : 'none';
    const t = broken.querySelector('[data-role="ib-broken-text"]');
    if(t) t.textContent = c.brokenNote || '';
  }
  const invalid = cardEl.querySelector('[data-role="ib-invalid"]');
  if(invalid) invalid.style.display = (st === 'invalid' && !c.brokenNote) ? '' : 'none';
  const stale = cardEl.querySelector('[data-role="ib-stale"]');
  if(stale){
    stale.style.display = st === 'stale' ? '' : 'none';
    const btn = stale.querySelector('[data-role="ib-stale-btn"]');
    if(btn){
      btn.setAttribute('data-act', gen.ok ? 'gen-insight' : 'refresh-upstream');
      btn.innerHTML = I.refresh + (gen.ok ? ' 重新生成' : ' 刷新上游并重新生成');
    }
  }
  const dirty = cardEl.querySelector('[data-role="ib-dirty"]');
  if(dirty) dirty.style.display = (st !== 'stale' && c.dirty && c.output && st !== 'generating') ? '' : 'none';
}
function updateGenInsightRow(cardEl, c, st, gen){
  const btn = cardEl.querySelector('[data-role="gen-insight-btn"]');
  if(btn){
    btn.disabled = !(gen.ok && st !== 'generating');
    if(st === 'generating') btn.innerHTML = '<span class="spin"></span>AI 分析中…';
    else btn.innerHTML = c.output ? (I.spark + ' 重新生成洞见') : (I.spark + ' 生成洞见');
  }
  const reason = cardEl.querySelector('[data-role="gen-insight-reason"]');
  if(reason){
    const show = !gen.ok && st !== 'generating';
    reason.style.display = show ? '' : 'none';
    if(show) reason.textContent = gen.reason || '';
  }
  const meta = cardEl.querySelector('[data-role="gen-insight-meta"]');
  if(meta){
    meta.style.display = c.output ? '' : 'none';
    if(c.output) meta.innerHTML = '上次生成 ' + c.genAt + ' · 数据 v' + c.genVersion;
  }
}
/* 洞见卡:刷新徽章/四类互斥横幅/动作区。不触碰引用列表与提示词文本框的值。 */
function patchInsightChrome(id){
  const c = findCard(id);
  const cardEl = $('#card-list [data-card-id="' + id + '"]');
  if(!c || !cardEl) return;
  const st = insightStatus(c);
  patchBadge(cardEl, st);
  if(cardEl.classList.contains('collapsed')){
    const sum = cardEl.querySelector('.cfg-sum');
    if(sum) sum.textContent = cfgSummary(c);
    return;
  }
  const gen = canGenerateInsight(c);
  updateInsightBanners(cardEl, c, st, gen);
  updateGenInsightRow(cardEl, c, st, gen);
}

/* 跨卡同步:某张 SQL 卡状态变化后,更新"所有"展开中的洞见卡引用列表里对应那一行
 * (复选框 disabled / 徽章 / 原因文案),但绝不重建整行或整份列表——
 * 各行是否勾选、是否正被点击均不受影响,不会打断正在进行的勾选操作。 */
function syncRefRowsFor(sqlId){
  const sqlCard = findCard(sqlId);
  if(!sqlCard || sqlCard.type !== 'sql') return;
  const rst = sqlStatus(sqlCard);
  state.cards.forEach(ic => {
    if(ic.type !== 'insight') return;
    const cardEl = $('#card-list [data-card-id="' + ic.id + '"]');
    /* 引用行本身只在左侧展开时才存在于 DOM 中,折叠时跳过这一步即可 */
    if(cardEl && !cardEl.classList.contains('collapsed')){
      const input = cardEl.querySelector('input[data-refid="' + sqlId + '"]');
      if(input){
        const row = input.closest('.ref-item');
        const after = cardIdx(sqlId) > cardIdx(ic.id);
        const checked = input.checked;
        const reason = refRowReason(rst, after);
        const disabled = !checked && (after || rst !== 'ready');
        input.disabled = disabled;
        if(row){
          row.classList.toggle('is-disabled', disabled);
          row.classList.toggle('is-invalid', checked && after);
          row.title = reason;
          const badgeEl = row.querySelector('.badge');
          if(badgeEl){ badgeEl.className = 'badge s-' + rst; badgeEl.innerHTML = badgeInner(rst); }
          const reasonEl = row.querySelector('.ref-reason');
          if(reasonEl){ reasonEl.style.display = reason ? '' : 'none'; reasonEl.textContent = reason; }
        }
      }
    }
    /* item4:不管左侧是否折叠,只要这张洞见卡引用了该 SQL 卡,其自身徽章/横幅与
       右侧成品预览区块都必须跟着刷新——两侧"是否过期"的口径必须保持一致,
       不能出现左侧已标黄过期、右侧仍是旧的正常展示这种不同步。 */
    if(ic.refIds.includes(sqlId)){
      patchInsightChrome(ic.id);
      rerenderPvBlock(ic.id);
      ic._syncedStatus = insightStatus(ic); // item1:级联刷新也要跟着更新缓存,否则该洞见卡下一次按键比对会用到过期的基准值
    }
  });
}

/* item2:统一的"某张卡状态变了"出口——任何会改变一张卡 sqlStatus/insightStatus 的路径都
 * 应该调用这一个函数,而不是各自零散地拼凑"该刷新哪几处"。它保证同一时刻做齐三件事:
 * ①左侧该卡自己的 chrome(徽章/横幅/按钮态);②右侧成品预览里该卡对应的区块;
 * ③顶栏的过期计数(以及连带联动——sql 卡还会级联刷新引用了它的洞见卡)。
 * 三处只要有一处漏掉,就会出现"左侧已经变了,右侧/顶栏还是旧的"这种口径不一致。 */
function syncCard(id){
  const c = findCard(id);
  if(!c) return;
  if(c.type === 'sql'){
    patchSqlChrome(id);
    syncRefRowsFor(id); // 级联刷新引用了这张 sql 卡的洞见卡(它们自己的 chrome + pv-block)
    c._syncedStatus = sqlStatus(c); // item1:记录这一刻真正同步到 DOM 的状态,供逐击键比对用
  } else if(c.type === 'insight'){
    patchInsightChrome(id);
    c._syncedStatus = insightStatus(c);
  }
  rerenderPvBlock(id);
  renderTopbar();
}

/* 结构性变化但时机安全(发生在某次 click 自身的同步处理中,不存在"正在进行中的
 * 另一次点击"会被打断)时,整卡替换是允许的:collapse 切换、查询增删改。 */
function rerenderCardFull(id){
  const c = findCard(id);
  const cardEl = $('#card-list [data-card-id="' + id + '"]');
  if(!c || !cardEl) return null;
  const tmp = document.createElement('div');
  tmp.innerHTML = cfgCard(c);
  const el = tmp.firstElementChild;
  cardEl.replaceWith(el);
  return el;
}

/* 只替换右侧成品预览中这一张卡对应的区块,不触碰其它卡片、不触碰左侧任何输入框——
 * 用于异步回调(取数/生成脚本/生成洞见完成)落地时局部刷新成品预览。 */
function rerenderPvBlock(id){
  const c = findCard(id);
  if(!c) return;
  const old = document.querySelector('#paper [data-card-id="' + id + '"]');
  const html = pvBlock(c);
  if(!old){
    if(html) renderPaper(); // 极端情况(如异步落地时恰好切到阅读模式)兜底整版重绘
    return;
  }
  if(!html){ old.remove(); return; }
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  old.replaceWith(tmp.firstElementChild);
}

function renderList(){
  const el = $('#card-list');

    '<button class="btn btn-sm" data-act="ins-add" data-type="insight" data-index="' + state.cards.length + '">' + I.spark + ' 洞见</button>' +
  '</div>';

/* ---------- 渲染:右侧成品 ---------- */
function chipLevel(v){
  const m = { '高危':'lv-high', '中危':'lv-mid', '低危':'lv-low' };
  return '<span class="chip ' + (m[v] || 'lv-low') + '">' + v + '</span>';
}
function chipStatus(v){
  const m = { '未处置':'st-open', '处置中':'st-doing', '已处置':'st-done', '已忽略':'st-ignore' };
  return '<span class="chip ' + (m[v] || 'st-ignore') + '">' + v + '</span>';
}
function tableHtml(snap){
  if(snap.kind === 'events'){
    return '<table class="rep-table"><thead><tr>' +
      '<th>事件ID</th><th>发生时间</th><th>事件类型</th><th>威胁等级</th><th>来源IP</th><th>处置状态</th>' +
      '</tr></thead><tbody>' +
      snap.rows.map(r =>
        '<tr><td class="mono">' + r.id + '</td><td class="mono">' + r.time + '</td><td>' + r.type + '</td>' +
        '<td>' + chipLevel(r.level) + '</td><td class="mono">' + r.ip + '</td><td>' + chipStatus(r.status) + '</td></tr>'
      ).join('') + '</tbody></table>';
  }
  const max = Math.max.apply(null, snap.rows.map(r => r.total));
  return '<table class="rep-table"><thead><tr>' +
    '<th>日期</th><th>事件总数</th><th style="text-align:right">高危事件</th><th style="text-align:right">已处置</th><th style="text-align:right">处置率</th>' +
    '</tr></thead><tbody>' +
    snap.rows.map(r =>
      '<tr><td class="mono">' + r.date + '</td>' +
      '<td><span class="cell-bar"><span class="bar" style="width:' + Math.round(r.total / max * 100) + '%"></span><span>' + r.total + '</span></span></td>' +
      '<td class="num">' + r.high + '</td><td class="num">' + r.handled + '</td>' +
      '<td class="num">' + Math.round(r.handled / r.total * 100) + '%</td></tr>'
    ).join('') + '</tbody></table>';
}
function skeletonTable(){
  let rows = '';
  /* 骨架屏高度尽量贴近真实取数结果(事件明细固定 10 行),减少"取数完成后表格突然变高"的跳动 */
  for(let i = 0; i < 10; i++){
    rows += '<div class="sk-row"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
  }
  return '<div class="skel-table"><div class="sk-row sk-head"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>' + rows + '</div>' +
    '<div class="skel-note"><span class="spin blue"></span>正在实时取数并执行渲染脚本…</div>';
}
function placeholderBlock(c, title, msg){
  return '<section class="pv-block pv-placeholder' + (state.selectedId === c.id ? ' selected' : '') + '" data-card-id="' + c.id + '">' +
    '<span class="type-ico t-' + c.type + '">' + typeIco(c.type) + '</span>' +
    '<span><b>' + esc(title) + '</b><span>' + msg + '</span></span>' +
  '</section>';
}
function staleFlag(c, text){
  if(state.mode === 'read') return '<span class="pv-flag">' + I.warn + text + '</span>';
  return '<button class="pv-flag" data-act="goto-card" data-target="' + c.id + '" title="点击定位到左侧配置">' + I.warn + text + '</button>';
}
/* 中性提示(item4):unconfigured / dirty 不算"真正过期",用灰/蓝而非黄色过期样式,
 * 且不计入顶栏 isStaleLike 的过期计数——与右侧视觉口径保持一致。 */
function noteFlag(c, text, tone){
  const cls = 'pv-note' + (tone === 'info' ? ' tone-info' : '');
  if(state.mode === 'read') return '<span class="' + cls + '">' + esc(text) + '</span>';
  return '<button class="' + cls + '" data-act="goto-card" data-target="' + c.id + '" title="点击定位到左侧配置">' + esc(text) + '</button>';
}
/* item2:hover 提示——右侧成品预览只能点选定位,不能直接编辑;静态文本块额外提示可双击编辑 */
function pvHint(isStatic){
  if(state.mode === 'read') return '';
  return '<span class="pv-hint">' + (isStatic ? '点击定位左侧配置 · 双击在左侧编辑' : '点击定位左侧配置,此处不可直接编辑') + '</span>';
}

function pvBlock(c){
  const sel = state.selectedId === c.id && state.mode === 'edit' ? ' selected' : '';
  if(c.type === 'static'){
    const untouched = c.html === STATIC_PLACEHOLDER_HTML;
    /* 未修改过的默认占位文本不是真实内容:阅读模式不展示;打印时靠 .pv-untouched 隐藏,兑现"所见即交付" */
    if(untouched && state.mode === 'read') return '';
    return '<section class="pv-block' + sel + (untouched ? ' pv-untouched' : '') + '" data-card-id="' + c.id + '" data-dblclick="static">' +
      pvHint(true) + '<div class="pv-static" data-body-of="' + c.id + '">' + c.html + '</div></section>';
  }
  if(c.type === 'sql'){
    const st = sqlStatus(c);
    if(st === 'previewing'){
      return '<section class="pv-block' + sel + '" data-card-id="' + c.id + '">' +
        '<h3 class="pv-caption"><span data-title-of="' + c.id + '">' + esc(c.title) + '</span></h3>' + skeletonTable() + '</section>';
    }
    if(st === 'unconfigured'){
      if(state.mode === 'read') return '';
      return placeholderBlock(c, c.title || TYPE_NAME.sql, '未配置 — 在左侧绑定 SQL 查询,并生成或手写渲染脚本');
    }
    if(!c.lastPreview){
      if(state.mode === 'read') return '';
      return placeholderBlock(c, c.title || TYPE_NAME.sql, '已配置,等待取数 — 点击左侧「运行取数」实时查询');
    }
    const lp = c.lastPreview;
    const hasTable = /render\.table/.test(c.script);
    const hasText = /render\.text/.test(c.script);
    let inner = '<h3 class="pv-caption"><span data-title-of="' + c.id + '">' + esc(c.title) + '</span></h3>';
    if(hasTable){
      lp.snapshots.forEach(s => {
        if(c.queries.length > 1) inner += '<div class="pv-qname">' + esc(s.name) + '</div>';
        inner += tableHtml(s);
      });
    }
    if(hasText){
      const t = textSummaryFor(c);
      if(t) inner += '<p class="pv-text">' + esc(t) + '</p>';
    }
    if(!hasTable && !hasText){
      inner += '<p class="pv-text" style="color:var(--hint)">渲染脚本未调用 render.table / render.text,没有产生任何输出。</p>';
    }
    inner += '<div class="pv-meta">数据快照 v' + lp.version + ' · 取数于 ' + lp.at + (c.queries.length > 1 ? ' · ' + c.queries.length + ' 个查询' : '') + '</div>';
    const stale = st === 'stale';
    return '<section class="pv-block' + sel + (stale ? ' is-stale' : '') + '" data-card-id="' + c.id + '">' +
      (stale ? staleFlag(c, staleReason(c) === 'config' ? '配置已变更 · 请重新取数' : '数据已过期 · 请重新取数') : pvHint(false)) +
      '<div class="' + (stale ? 'stale-dim' : '') + '">' + inner + '</div></section>';
  }
  /* insight */
  const st = insightStatus(c);
  if(st === 'generating'){
    return '<section class="pv-block' + sel + '" data-card-id="' + c.id + '"><div class="pv-insight-box">' +
      '<div class="ins-head"><span class="ai-mark">' + I.spark + '</span><b>AI 智能洞见</b></div>' +
      '<div class="skel skel-line" style="width:96%"></div><div class="skel skel-line" style="width:88%"></div><div class="skel skel-line" style="width:62%"></div>' +
      '<div class="skel-note"><span class="spin blue"></span>大模型正在基于最新数据生成分析结论…</div>' +
    '</div></section>';
  }
  if(!c.output){
    if(state.mode === 'read') return '';
    const msg = st === 'invalid' ? '引用无效 — 洞见只能引用位于其上方的数据卡'
      : st === 'generatable' ? '已配置,等待生成 — 点击左侧「生成洞见」'
      : '未配置 — 在左侧选择引用的数据卡并填写提示词';
    return placeholderBlock(c, c.title || TYPE_NAME.insight, msg);
  }
  const refNames = c.refIds.map(id => { const r = findCard(id); return r ? (r.title || '未命名卡片') : null; }).filter(Boolean);
  /* item4:只有"真正过期/失效"(stale / invalid / brokenNote,与顶栏 isStaleLike 完全同口径)
   * 才用黄色过期样式并弱化展示;unconfigured(引用或提示词已清空)与 dirty(配置已修改)
   * 是较温和的中性提示,不计入顶栏过期数,也不做旧内容变灰处理。 */
  const isExpired = st === 'stale' || st === 'invalid' || !!c.brokenNote;
  const isUnconfiguredNote = !isExpired && st === 'unconfigured';
  const isDirtyNote = !isExpired && !isUnconfiguredNote && !!c.dirty;
  let flagHtml = '';
  if(isExpired){
    const flagText = st === 'invalid' ? '引用失效 · 请调整配置'
      : c.brokenNote ? '引用已删除 · 请重新配置'
      : '上游已更新 · 请重新生成';
    flagHtml = staleFlag(c, flagText);
  } else if(isUnconfiguredNote){
    flagHtml = noteFlag(c, '引用或提示词已清空 · 结论已不再关联当前配置', 'gray');
  } else if(isDirtyNote){
    flagHtml = noteFlag(c, '配置已修改 · 建议重新生成', 'info');
  } else {
    flagHtml = pvHint(false);
  }
  const sectionCls = isExpired ? ' is-stale' : ((isUnconfiguredNote || isDirtyNote) ? ' is-note' : '');
  return '<section class="pv-block' + sel + sectionCls + '" data-card-id="' + c.id + '">' +
    flagHtml +
    '<div class="' + (isExpired ? 'stale-dim' : '') + '"><div class="pv-insight-box">' +
      '<div class="ins-head"><span class="ai-mark">' + I.spark + '</span><b>AI 智能洞见</b>' +
        '<span class="ins-src">' + I.link + ' 基于:<span data-ins-src-of="' + c.id + '">' + esc(refNames.join('、') || '(引用已删除)') + '</span></span></div>' +
      '<p class="ins-text">' + esc(c.output) + '</p>' +
      '<div class="pv-meta">生成于 ' + c.genAt + ' · 数据版本 v' + c.genVersion + '</div>' +
    '</div></div></section>';
}

function renderPaper(){
  const wrap = $('#paper-scroll');
  const sc = wrap.scrollTop;
  const paper = $('#paper');

        '<p><b style="color:var(--text-2)">成品预览将在此实时呈现</b><br>左侧添加卡片后立即可见 · 预览即最终交付物,不含任何配置界面</p>' +
      '</div>';

function renderHeads(){
  $('#editor-head').innerHTML =
    '<b>报告结构</b><span>' + state.cards.length + ' 张卡片</span>' +
    '<span class="ph-hint">拖拽排序 · 点击卡片与右侧联动</span>';

    ? '<b>阅读模式</b><span>最终交付版式</span><span class="ph-hint">切回编辑模式可继续修改配置</span>'
