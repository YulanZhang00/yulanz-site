}

/* item1:renderAll() 是"整份重画",画面上呈现的必然就是当下最新的 sqlStatus/insightStatus——
 * 借这个机会把每张卡的 _syncedStatus 缓存一并校准,不然拖拽排序、撤销、模拟数据源更新这些
 * 不经过 syncCard() 的整卡重渲染路径,会让缓存悄悄落后于画面,下一次逐击键比对就可能用错基准。 */
function refreshStatusCache(){
  state.cards.forEach(c => {
    if(c.type === 'sql') c._syncedStatus = sqlStatus(c);
    else if(c.type === 'insight') c._syncedStatus = insightStatus(c);
  });
}
function renderAll(){
  renderTopbar();
  renderHeads();
  renderList();
  renderPaper();
  syncDocTitle();
  document.body.classList.toggle('mode-read', state.mode === 'read');
  refreshStatusCache();
  if(!booting) schedulePersist(); // item5:见 booting 声明处的注释——初始化这一次不写盘
}

/* ---------- 真持久化(item6):整份 state 存入 localStorage,刷新页面后仍在 ----------
 * 细粒度局部更新不会经过 renderAll(),因此在每个会改变可持久化数据的地方
 * (change/async 回调等)也需要单独调用 schedulePersist()。 */
const PERSIST_KEY = 'reportEditorD.v1';
let persistTimer = null;
function schedulePersist(){
  clearTimeout(persistTimer);
  persistTimer = setTimeout(doPersist, 500);
}
/* item3:previewing/generating/genScriptBusy/pendingScript 都只是"异步操作进行中"的瞬时标记,
 * 唯一负责把它们复位回稳定态的是对应 setTimeout 的回调。一旦离开了那个回调还能触发的场景——
 * 页面被刷新(回调随页面一起消失)、或卡片在异步进行中被删除又被撤销恢复(原回调届时已经
 * 因为找不到卡片而提前退出、不会再有第二次机会复位)——这些标记就会永远卡住,界面上表现为
 * "取数中/生成中"转不动。因此:写入 localStorage 前、以及删除卡片存入撤销快照前,都必须
 * 统一把这些临时态降级为稳定态。 */
const TRANSIENT_FLAGS = ['previewing', 'generating', 'genScriptBusy'];
function sanitizeCardInPlace(c){
  if(!c) return c;
  TRANSIENT_FLAGS.forEach(k => { if(k in c) c[k] = false; });
  if('pendingScript' in c){ c.pendingScript = null; c.pendingScriptVer = null; }
  return c;
}
function sanitizeCardCopy(c){
  return sanitizeCardInPlace(Object.assign({}, c));
}
function doPersist(){
  try{
    /* 用浅拷贝清洗后再写盘——绝不直接修改 state.cards 里的活对象,避免把一个
       真正正在进行中的异步操作(比如取数确实还没跑完)误当成"已中断"而提前复位。 */
    const cleanCards = state.cards.map(sanitizeCardCopy);
    const payload = { v:1, docName: state.docName, dataVersion: state.dataVersion, savedAt: Date.now(), cards: cleanCards };
    localStorage.setItem(PERSIST_KEY, JSON.stringify(payload));
    lastSavedAt = new Date();
    updateSaveHint();
  } catch(err){ /* 隐私模式 / 存储配额已满等场景下静默失败,不影响正常编辑 */ }
}
/* 返回值:false=无可恢复内容;true=正常恢复;'stuck'=恢复成功但清洗到了残留的中断态
 * (用于初始化时额外提示用户"已重置为可重新操作")。 */
/* item5:仅校验"是不是数组、有没有长度"太浅——卡片对象缺字段(如 sql 卡没有 queries
 * 数组)不会在这一步报错,而是要等到 state.cards 已被替换、renderAll() 渲染到那张
 * 具体卡片时才炸出 TypeError(如 c.queries.length)。那次崩溃发生在 loadPersisted()
 * 之外、整个初始化流程又没有更外层的保护,会直接白屏。因此在写入 state 之前,先对
 * 每张卡片做最小限度的结构校验;任何一张不达标就把整份 payload 当作损坏数据整体丢弃,
 * 安全地退回空状态,而不是带着半成形的卡片去赌后面的渲染不会崩。 */
const VALID_CARD_TYPES = { static:1, sql:1, insight:1 };
function isPersistedCardShapeOk(c){
  if(!c || typeof c !== 'object') return false;
  if(typeof c.id !== 'string' || !VALID_CARD_TYPES[c.type]) return false;
  if(c.type === 'sql' && !Array.isArray(c.queries)) return false;
  if(c.type === 'insight' && !Array.isArray(c.refIds)) return false;
  return true;
}
function loadPersisted(){
  try{
    const raw = localStorage.getItem(PERSIST_KEY);
    if(!raw) return false;
    const payload = JSON.parse(raw);
    if(!payload || typeof payload !== 'object' || !Array.isArray(payload.cards) || !payload.cards.length) return false;
    if(!payload.cards.every(isPersistedCardShapeOk)) return false;
    /* item5:走到这里只说明 id/type/queries/refIds 这几个字段合法,basis/script/html/
     * prompt 等字段仍可能整个缺失(旧版本数据、外部注入的半成形 payload 等)——用
     * makeCard(type) 的默认值兜底归一化补齐,避免下游渲染时对 undefined 调用
     * .trim()/.replace() 等方法而抛 TypeError。Object.assign 以 c 的字段为准覆盖
     * 默认值,因此已有的真实数据(包括 id)不受影响,只补缺。 */
    const normalizedCards = payload.cards.map(c => Object.assign(makeCard(c.type), c));
    let hadStuck = false;
    normalizedCards.forEach(c => {
      if(c.previewing || c.generating || c.genScriptBusy || c.pendingScript){
        hadStuck = true;
        sanitizeCardInPlace(c);
      }
    });
    state.cards = normalizedCards;
    state.docName = typeof payload.docName === 'string' && payload.docName ? payload.docName : state.docName;
    state.dataVersion = typeof payload.dataVersion === 'number' && payload.dataVersion > 0 ? payload.dataVersion : 1;
    /* 保存提示应反映"确实曾经保存过"这一事实,而不是等下一次编辑触发新的 500ms
       防抖保存才显示——否则会出现"内容明明是恢复回来的,保存提示却写着尚未保存"的矛盾。 */
    lastSavedAt = payload.savedAt ? new Date(payload.savedAt) : new Date();
    /* #docname 是顶栏里独立于 renderAll() 渲染范围之外的输入框,不手动同步其 value
       的话,恢复后的文档名只会体现在 state / 标签页标题上,输入框本身仍显示旧的
       硬编码占位值——两处显示不一致。 */
    const nameEl = $('#docname');
    if(nameEl) nameEl.value = state.docName;
    return hadStuck ? 'stuck' : true;
  } catch(err){ return false; }
}

/* ---------- 联动 ---------- */
function setHover(id){
  if(hoverId === id) return;
  $$('.peer-hover').forEach(n => n.classList.remove('peer-hover'));
  hoverId = id;
  if(!id || state.mode === 'read') return;
  $$('[data-card-id="' + id + '"]').forEach(n => n.classList.add('peer-hover'));
}
/* 卡片重命名即时同步:左侧洞见卡的引用列表名称 + 右侧洞见预览的「基于:」标注(不做整体重渲染) */
function syncCardTitleRefs(c){
  if(c.type !== 'sql') return;
  const label = c.title || '未命名卡片';
  $$('.ref-name[data-ref-name-of="' + c.id + '"]').forEach(n => { n.textContent = label; });
  state.cards.forEach(ic => {
    if(ic.type === 'insight' && ic.refIds.includes(c.id)){
      const el = $('[data-ins-src-of="' + ic.id + '"]');
      if(el){
        const names = ic.refIds.map(id => { const r = findCard(id); return r ? (r.title || '未命名卡片') : null; }).filter(Boolean);
        el.textContent = names.join('、') || '(引用已删除)';
      }
    }
  });
}
/* 顶栏文档名同步到浏览器标签页标题与打印页眉 */
function syncDocTitle(){
  const name = (state.docName || '').trim() || '未命名报告';
  document.title = name + ' · 智能报告编辑器';
  const ph = $('#print-header');
  if(ph) ph.textContent = name;
}
/* 短暂闪烁高亮某个 DOM 节点,不改变选中态、不触发滚动——用于"完成了但不该抢用户当前焦点/滚动位置"的场景 */
function flashEl(el){
  if(!el) return;
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1000);
}
/* item6:洞见生成完成后只在右侧成品预览里对应区块闪一下提示"这里更新了",不抢用户当前的
 * 选中态与滚动位置(区别于 selectCard 的"跳转定位"语义)。 */
function flashPvBlock(id){
  flashEl($('#paper [data-card-id="' + id + '"]'));
}
function selectCard(id, source){
  state.selectedId = id;
  $$('.cfg-card.selected, .pv-block.selected').forEach(n => n.classList.remove('selected'));
  $$('[data-card-id="' + id + '"]').forEach(n => n.classList.add('selected'));
  if(source === 'left' || source === 'both'){
    const pv = $('#paper [data-card-id="' + id + '"]');
    if(pv){ pv.scrollIntoView({ behavior:'smooth', block:'nearest' }); flashEl(pv); }
  }
  if(source === 'right' || source === 'both'){
    const cf = $('#card-list [data-card-id="' + id + '"]');
    if(cf){ cf.scrollIntoView({ behavior:'smooth', block:'nearest' }); flashEl(cf); }
  }
}

/* ---------- 动作 ---------- */
function addCard(type, index){
  const c = makeCard(type);
  state.cards.splice(index, 0, c);
  renderAll();
  selectCard(c.id, 'both');
  toast('已插入「' + TYPE_NAME[type] + '」卡片', 'success');
}

/* ---------- 删除与撤销(item9:支持多条依次撤销,每个 toast 持有自己的快照) ---------- */
function requestDelete(id){
  const c = findCard(id);
  if(!c) return;
  const deps = state.cards.filter(x => x.type === 'insight' && x.refIds.includes(id));
  if(c.type === 'sql' && deps.length){
    openConfirm({
      title:'删除被引用的数据卡?',
      body:'<p style="font-size:12px;line-height:19px">「<b>' + esc(c.title) + '</b>」正被以下洞见卡引用,删除后这些洞见将失去数据来源:</p>' +
        '<ul class="dep-list">' + deps.map(d => '<li>' + I.spark + esc(d.title || '未命名洞见') + '</li>').join('') + '</ul>' +
        '<p style="font-size:11px;color:var(--hint);margin-top:6px">删除后,相关洞见卡会被标记为「引用已删除」,需重新配置;此操作同样可以撤销。</p>',
      okText:'仍要删除', danger:true,
      onOk(){
        const brokenRefs = deps.map(d => ({
          insightId: d.id, prevRefIds: d.refIds.slice(), prevBrokenNote: d.brokenNote, prevDirty: d.dirty
        }));
        deps.forEach(d => {
          d.refIds = d.refIds.filter(x => x !== id);
          d.brokenNote = '引用的「' + (c.title || '未命名卡片') + '」已被删除';
          d.dirty = true;
        });
        doDelete(id, brokenRefs);
      }
    });
    return;
  }
  doDelete(id, []);
}
function doDelete(id, brokenRefs){
  const i = cardIdx(id);
  if(i < 0) return;
  const card = state.cards[i];
  state.cards.splice(i, 1);
  state.pendingInsights = state.pendingInsights.filter(pid => pid !== id);
  if(state.selectedId === id) state.selectedId = null;
  /* item3:卡片被删除时若正处于取数中/生成中,原本负责复位这些临时态的 setTimeout 回调
   * 稍后会因为 findCard 找不到卡片而提前退出——如果此后又被撤销恢复,卡片就会带着永远
   * 转不动的"取数中"之类状态复活。删除时先清洗掉这些临时态,撤销快照永远是干净的。 */
  sanitizeCardInPlace(card);
  renderAll();
  pushUndo(card, i, brokenRefs || []);
}
/* 每条撤销记录持有自己独立的快照(卡片本体 + 受影响洞见卡的引用/脏标/失效文案),
 * 多次删除会各自入栈,互不覆盖;通过 toast 上的 data-undo-id 精确关联到某一条。 */
function pushUndo(card, index, brokenRefs){
  const entry = { id: card.id, undoId: card.id + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6) };
  entry.restore = () => {
    state.cards.splice(Math.min(index, state.cards.length), 0, card);
    brokenRefs.forEach(r => {
      const ic = findCard(r.insightId);
      if(ic){ ic.refIds = r.prevRefIds; ic.brokenNote = r.prevBrokenNote; ic.dirty = r.prevDirty; }
    });
    renderAll();
    selectCard(card.id, 'both');
    toast('已恢复卡片' + (brokenRefs.length ? '及相关洞见的引用' : ''), 'success');
  };
  undoStack.push(entry);
  toast(
    '已删除「' + esc(card.title || TYPE_NAME[card.type]) + '」' + (brokenRefs.length ? ',相关洞见卡已标记为引用失效' : ''),
    brokenRefs.length ? 'warning' : 'info',
    { label:'撤销', act:'undo-del', undoId: entry.undoId }
  );
}
/* 按 toast 上的 undoId 精确恢复对应快照;找不到(已被恢复/已过期被清理)则安全地什么都不做,
 * 相当于对索引做了钳制,不会误恢复到别的快照。 */
function undoByToastId(undoId){
  if(!undoId) return;
  const idx = undoStack.findIndex(e => e.undoId === undoId);
  if(idx < 0) return;
  const entry = undoStack[idx];
  undoStack.splice(idx, 1);
  entry.restore();
}

/* ---------- 异步回调(item1):只重建自己那张卡的相关区域 + 该卡在成品预览中的区块;
 * 不做整表/整卡列表重建,天然不会打断用户在其它卡片中的输入焦点与光标。 ---------- */
function runGenScript(id){
  const c = findCard(id);
  if(!c || c.genScriptBusy) return;
  if(!c.queries.length || !c.basis.trim()) return;
  c.genScriptBusy = true;
  patchSqlChrome(id);
  setTimeout(() => {
    const cc = findCard(id);
    if(!cc) return;
    cc.genScriptBusy = false;
    /* item5/item3:若此刻用户焦点正在这张卡的脚本框内,说明她可能正在手写/查看脚本——
     * 不静默把 state.script 换成 AI 结果(那会让"当前运行取数实际执行的脚本"与
     * "脚本框里肉眼可见的内容"分叉)。先把新脚本存进 pendingScript,展示一条
     * 小提示条,只有用户显式点击「应用」才会真正落地——不再有失焦自动应用的路径。 */
    const cardEl = $('#card-list [data-card-id="' + id + '"]');
    const ta = cardEl ? cardEl.querySelector('[data-role="script-ta"]') : null;
    const focused = !!(ta && document.activeElement === ta);
    const prevVer = cc.scriptVer || 0;
    cc.scriptVer = prevVer + 1; // genScriptFor 依据 scriptVer 决定奇偶写法风格,需要先算出下一版本
    const generated = genScriptFor(cc);
    if(focused){
      cc.scriptVer = prevVer; // 尚未真正应用,版本号先回退,避免"没应用却已经+1"的错觉
      cc.pendingScript = generated;
      cc.pendingScriptVer = prevVer + 1;
    } else {
      cc.script = generated;
      cc.scriptEdited = false;
      if(cc.lastPreview) cc.configDirty = true;
      cc.pendingScript = null;
      cc.pendingScriptVer = null;
    }
    applyScriptToDom(cc);
    syncCard(id);
    schedulePersist();
    toast(focused
      ? 'AI 已生成新脚本,脚本框上方点击「应用」后生效'
      : 'AI 已生成渲染脚本(v' + cc.scriptVer + ')' + (cc.lastPreview ? ',请重新取数' : ''),
      'success');
  }, 700);
}
/* 把新脚本写回脚本文本框的 value——若用户此刻恰好正在这个文本框里输入,
 * 则跳过覆盖,避免打断输入 / 冲掉正在敲的内容。
 * force=true 时无条件回写(用于「应用」这类用户显式授权的路径),此时不应再受
 * 焦点是否停留在文本框内这一条件限制——否则会出现"state 已经换成 AI 脚本、
 * 文本框却仍显示手改版"的分叉,而这恰恰是用户点「应用」想要的结果。 */
function applyScriptToDom(c, force){
  const cardEl = $('#card-list [data-card-id="' + c.id + '"]');
  if(!cardEl) return;
  const ta = cardEl.querySelector('[data-role="script-ta"]');
  if(!ta) return;
  if(force || document.activeElement !== ta) ta.value = c.script;
  ta.rows = scriptRows(c);
}
/* item3:应用脚本框上方暂存的 AI 生成结果——现在只在用户显式点击「应用」时调用
 * (不再有 focusout 自动应用的路径),调用方自行决定是否需要先弹确认。点「应用」
 * 本身就是显式授权,因此这里必须强制回写文本框(force=true),焦点守卫只留给
 * runGenScript 的自动路径。 */
function applyPendingScript(c){
  if(!c || !c.pendingScript) return;
  c.script = c.pendingScript;
  if(c.pendingScriptVer) c.scriptVer = c.pendingScriptVer;
  c.scriptEdited = false;
  if(c.lastPreview) c.configDirty = true;
  c.pendingScript = null;
  c.pendingScriptVer = null;
  applyScriptToDom(c, true);
  schedulePersist();
}
/* item3:点击脚本框上方「应用」按钮的入口——若挂起期间用户已经在脚本框里手改过内容
 * (c.scriptEdited),应用会静默覆盖那些手动修改,先弹确认再决定是否继续。 */
function requestApplyPendingScript(cid){
  const c = findCard(cid);
  if(!c || !c.pendingScript) return;
  const doApply = () => {
    const ver = c.pendingScriptVer || c.scriptVer;
    applyPendingScript(c);
    syncCard(cid);
    toast('已应用 AI 生成的脚本(v' + ver + ')' + (c.lastPreview ? ',请重新取数' : ''), 'success');
  };
  if(c.scriptEdited){
    openConfirm({
      title:'应用 AI 生成的脚本?',
      body:'<p style="font-size:12px;line-height:19px">脚本框内当前有<b>手动修改</b>,应用 AI 生成结果将<b>覆盖</b>这些修改,且无法撤销,请确认。</p>',
      okText:'仍要应用', danger:true,
      onOk(){ doApply(); }
    });
  } else {
    doApply();
  }
}
/* item3:点击「AI 生成脚本 / 重新生成脚本」按钮的入口——依次检查两类会被覆盖的内容:
 * ①还没应用的 pending 结果(先问是否放弃);②脚本框里已有的手动修改(再问是否覆盖)。
 * 两种情况可能同时存在,因此在第一层确认的 onOk 里再决定要不要接着弹第二层。 */
function requestGenScript(cid){
  const c = findCard(cid);
  if(!c) return;
  const proceedAfterPendingHandled = () => {
    if(c.script && c.scriptEdited){
      openConfirm({
        title:'重新生成脚本?',
        body:'<p style="font-size:12px;line-height:19px">当前脚本包含<b>手动修改</b>,重新生成将<b>覆盖</b>这些修改,且无法撤销,请确认。</p>',
        okText:'仍要重新生成', danger:true,
        onOk(){ runGenScript(cid); }
      });
    } else {
      runGenScript(cid);
    }
  };
  if(c.pendingScript){
    openConfirm({
      title:'放弃待应用的脚本?',
      body:'<p style="font-size:12px;line-height:19px">当前有一份 AI 已生成但尚未应用的脚本,重新生成将<b>放弃</b>它,且无法撤销,请确认。</p>',
      okText:'放弃并重新生成', danger:true,
      onOk(){
        c.pendingScript = null;
        c.pendingScriptVer = null;
        syncCard(cid);
        schedulePersist();
        proceedAfterPendingHandled();
      }
    });
  } else {
    proceedAfterPendingHandled();
  }
}

function runPreview(id){
  const c = findCard(id);
  if(!c || c.previewing) return;
  if(sqlStatus(c) === 'unconfigured') return;
  c.previewing = true;
  syncCard(id);
  setTimeout(() => {
    const cc = findCard(id);
    if(!cc) return;
    cc.previewing = false;
    cc.lastPreview = { version: state.dataVersion, ts: Date.now(), at: fmtTime(), snapshots: buildSnapshots(cc) };
    cc.configDirty = false;
    syncCard(id);
    schedulePersist();
    toast('「' + esc(cc.title) + '」取数完成 · 数据 v' + state.dataVersion, 'success');
    maybeRunPendingInsight();
  }, 800);
}

function runGenInsight(id){
  const c = findCard(id);
  if(!c || c.generating) return;
  const gate = canGenerateInsight(c);
  if(!gate.ok) return;
  c.generating = true;
  syncCard(id);
  setTimeout(() => {
    const cc = findCard(id);
    if(!cc) return;
    cc.generating = false;
    cc.genCount = (cc.genCount || 0) + 1;
    cc.output = composeInsight(cc);
    cc.genTs = Date.now();
    cc.genAt = fmtTime();
    cc.genVersion = state.dataVersion;
    cc.genPrompt = cc.prompt;
    cc.dirty = false;
    cc.brokenNote = '';
    syncCard(id);
    schedulePersist();
    /* item6:生成完成不再 selectCard 抢用户当前的选中/滚动位置——只用 toast + 目标
     * pv-block 短暂闪烁提示"这里更新了"。flashPvBlock 必须在 syncCard(id) 之后调用,
     * 因为 rerenderPvBlock 已经把该卡对应的 DOM 节点整个替换成了新引用。 */
    flashPvBlock(id);
    toast('洞见已生成 · 基于数据 v' + cc.genVersion, 'success');
  }, 1200);
}

/* item9:pendingInsights 是队列而非单值,多张洞见卡同时等待上游刷新时互不覆盖 */
function refreshUpstream(id){
  const c = findCard(id);
  if(!c) return;
  const targets = c.refIds.map(findCard).filter(r => r && sqlStatus(r) !== 'ready' && sqlStatus(r) !== 'unconfigured');
  if(!targets.length){
    toast('上游数据卡未配置或不可刷新,请先在上游完成配置', 'warning');
    return;
  }
  if(!state.pendingInsights.includes(id)) state.pendingInsights.push(id);
  toast('正在刷新 ' + targets.length + ' 张上游数据卡…', 'info');
  targets.forEach(t => runPreview(t.id));
}
function maybeRunPendingInsight(){
  if(!state.pendingInsights.length) return;
  const queue = state.pendingInsights;
  state.pendingInsights = [];
  queue.forEach(id => {
    const c = findCard(id);
    if(!c) return; // 目标洞见卡已被删除,跳过这一条,不影响队列中其它条目
    const gate = canGenerateInsight(c);
    if(gate.ok){ runGenInsight(id); return; }
    /* 上游还没全部结束:重新排回队列,等下一张上游卡取数完成后再检查 */
    const stillRunning = c.refIds.map(findCard).some(r => r && r.previewing);
    if(stillRunning){
      if(!state.pendingInsights.includes(id)) state.pendingInsights.push(id);
    } else {
      toast('已停止自动刷新「' + esc(c.title || TYPE_NAME.insight) + '」:' + gate.reason, 'warning');
    }
  });
}

function simulateDataUpdate(){
  state.dataVersion++;
  let affected = 0;
  state.cards.forEach(c => {
    if(c.type === 'sql' && c.lastPreview && c.lastPreview.version < state.dataVersion) affected++;
  });
  renderAll();
  if(affected){
    toast('数据源已更新至 v' + state.dataVersion + ',' + affected + ' 张数据卡的取数结果已过期', 'warning');
  } else {
    toast('数据源已更新至 v' + state.dataVersion + '(当前没有受影响的取数结果)', 'info');
  }
}

function jumpStale(){
  const c = state.cards.find(isStaleLike);
  if(c){
    if(state.mode === 'read'){ state.mode = 'edit'; renderAll(); }
    selectCard(c.id, 'both');
  }
}

/* ---------- 新建空白报告(item7) ---------- */
function requestNewBlankReport(){
  if(!state.cards.length){
    toast('当前已是空白报告', 'info');
    return;
  }
  openConfirm({
    title:'新建空白报告?',
    body:'<p style="font-size:12px;line-height:19px">将清空当前画布上的全部 <b>' + state.cards.length + '</b> 张卡片,并把文档名重置为「未命名报告」。</p>' +
      '<p style="font-size:11px;color:var(--hint);margin-top:6px">操作完成后会出现一条可撤销的提示,点击其中的「撤销」按钮即可恢复;该提示消失后将无法再撤销,请确认。</p>',
    okText:'新建空白报告', danger:true,
    onOk(){ doNewBlankReport(); }
  });
}
function doNewBlankReport(){
  const prevCards = state.cards;
  const prevName = state.docName;
  const prevVersion = state.dataVersion;
  const prevPending = state.pendingInsights;
  const prevSelected = state.selectedId;
  undoStack = []; // 避免之前的"撤销删除"快照把旧卡插回刚新建的空白报告
  /* 与 doDelete 同理:快照里的卡片若正处于取数中/生成中,原本负责复位的 setTimeout
     回调马上会因为 findCard 找不到卡片而提前退出——若不在此清洗,撤销恢复后卡片会
     带着永远转不动的"取数中"复活。 */
  prevCards.forEach(sanitizeCardInPlace);
  state.cards = [];
  state.docName = '未命名报告';
  state.selectedId = null;
  state.pendingInsights = [];
  const nameEl = $('#docname');
  if(nameEl) nameEl.value = state.docName;
  renderAll();
  const undoId = 'newblank-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
  undoStack.push({
    id:'__newblank__', undoId,
    restore(){
      state.cards = prevCards;
      state.docName = prevName;
      state.dataVersion = prevVersion;
      state.pendingInsights = prevPending;
      state.selectedId = prevSelected;
      const ne = $('#docname');
      if(ne) ne.value = state.docName;
      renderAll();
      toast('已恢复原内容', 'success');
    }
  });

function saveQueryModal(){
  if(!modalCtx || modalCtx.kind !== 'query') return;
  const name = $('#qm-name').value.trim();
  const sql = $('#qm-sql').value.trim();
  const err = $('#qm-err');
  if(!name || !sql){
    err.textContent = !name ? '请填写查询名称' : '请填写 SQL 文本';
    err.style.display = 'block';
    return;
  }
  const cardId = modalCtx.cardId;
  const c = findCard(cardId);
  if(c){
    if(modalCtx.qid){
      const q = c.queries.find(x => x.id === modalCtx.qid);
      if(q){ q.name = name; q.sql = sql; }
    } else {
      c.queries.push({ id: uid(), name, sql });
    }
    if(c.lastPreview) c.configDirty = true;
  }
  closeModal();
  if(c){
    /* item2:查询增删改会改变这张卡的 sqlStatus(如已取数过的卡变为待重新取数),
     * 必须走统一的 syncCard——左侧 chrome、右侧 pv-block、顶栏过期计数三处一起刷新,
     * 不能只改左侧留右侧展示旧结果。 */
    rerenderCardFull(cardId);
    syncCard(cardId);
    schedulePersist();
  }
  toast('查询已保存' + (c && c.lastPreview ? ',请重新取数' : ''), 'success');
}
/* item5:弹窗内容与打开时的初始值不同即视为"已有输入" */
function queryModalDirty(){
  if(!modalCtx || modalCtx.kind !== 'query') return false;
  const nameEl = $('#qm-name'), sqlEl = $('#qm-sql');
  if(!nameEl || !sqlEl) return false;
  return nameEl.value !== modalCtx.baseline.name || sqlEl.value !== modalCtx.baseline.sql;
}
function closeModal(){
  $('#modal-root').innerHTML = '';

}
/* item5:点遮罩 / 按 Esc / 点「取消」关闭查询弹窗前,若已有未保存的修改,一律先原地
 * 弹出确认条再决定是否真正关闭——用同一个 qm-discard-bar,而不是像通用确认弹窗那样
 * 另开一层 overlay:另开一层会把当前查询表单从 DOM 里整个替换掉,一旦用户在那层
 * 点"取消"就再也回不到原来正在编辑的表单了(那正是"取消"本该做到的事)。 */

/* ---------- Toast ---------- */
function toast(msg, type, action){
  const root = $('#toast-root');
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  const ico = type === 'success' ? I.check : (type === 'warning' ? I.warn : I.clock);
  el.innerHTML = '<span class="t-ico">' + ico + '</span><span>' + msg + '</span>' +
    (action ? '<button class="btn-text btn btn-sm" data-act="' + action.act + '"' + (action.undoId ? ' data-undo-id="' + esc(action.undoId) + '"' : '') + '>' + action.label + '</button>' : '');
  root.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 300);
    /* toast 过期后,对应的撤销快照也一并从栈里清掉,避免无限增长 */
    if(action && action.undoId) undoStack = undoStack.filter(en => en.undoId !== action.undoId);
  }, action ? 5000 : 3200);
}

/* ---------- 事件委托:点击 ---------- */
document.addEventListener('click', e => {
  const actEl = e.target.closest('[data-act]');

  /* 关闭插入菜单(点击其它区域时) */
  if(!e.target.closest('.ins-zone')) $$('.ins-zone.open').forEach(z => z.classList.remove('open'));

  /* 遮罩点击关闭(item5:查询弹窗有未保存输入时先确认丢弃) */
  if(e.target.dataset && e.target.dataset.overlay){ requestCloseModal(); return; }

  if(!actEl){
    /* 无动作:处理联动选中 */
    if(state.mode === 'edit'){
      const pv = e.target.closest('.pv-block');
      if(pv){ selectCard(pv.dataset.cardId, 'right'); return; }
      const cf = e.target.closest('.cfg-card');
      if(cf && state.selectedId !== cf.dataset.cardId) selectCard(cf.dataset.cardId, 'left');
    }
    return;
  }

  const act = actEl.dataset.act;
  const cardEl = actEl.closest('[data-card-id]');
  const cid = cardEl ? cardEl.dataset.cardId : null;

  switch(act){
    case 'mode':
      state.mode = actEl.dataset.mode;
      renderAll();
      break;
    case 'print':
      window.print();
      break;
    case 'sim-update':
      simulateDataUpdate();
      break;
    case 'load-example':
      requestLoadExample();
      break;
    case 'new-blank':
      requestNewBlankReport();
      break;
    case 'jump-stale':
      jumpStale();
      break;
    case 'undo-del':
      undoByToastId(actEl.dataset.undoId);
      actEl.closest('.toast') && actEl.closest('.toast').remove();
      break;
    case 'ins-open': {
      const z = actEl.closest('.ins-zone');
      const wasOpen = z.classList.contains('open');
      $$('.ins-zone.open').forEach(x => {
        x.classList.remove('open');
        const m = x.querySelector('.ins-menu');
        if(m) m.classList.remove('flip-up');
      });
      if(!wasOpen){
        z.classList.add('open');
        const menu = z.querySelector('.ins-menu');
        if(menu){
          /* 靠近视口底部、下方放不下菜单时向上翻转展开,避免被裁切 */
          const zoneRect = z.getBoundingClientRect();
          const menuH = menu.offsetHeight;
          if(zoneRect.bottom + 20 + menuH > window.innerHeight) menu.classList.add('flip-up');
        }
      }
      break;
    }
    case 'ins-add': {
      const idx = parseInt(actEl.dataset.index, 10);
      addCard(actEl.dataset.type, isNaN(idx) ? state.cards.length : idx);
      break;
    }
    case 'collapse': {
      /* 折叠/展开是本次 click 自身同步处理内的结构性变化,不存在"另一个正在进行中的点击"
       * 会被打断,因此这里整卡替换是安全的(区别于 change/input 引起的细粒度局部更新)。 */
      const c = findCard(cid);
      if(c){ c.collapsed = !c.collapsed; rerenderCardFull(cid); schedulePersist(); }
      break;
    }
    case 'del-card':
      requestDelete(cid);
      break;
    case 'q-new':
      openQueryModal(cid, null);
      break;
    case 'q-edit':
      openQueryModal(cid, actEl.dataset.qid);
      break;
    case 'q-del': {
      const c = findCard(cid);
      if(c){
        c.queries = c.queries.filter(q => q.id !== actEl.dataset.qid);
        if(!c.queries.length){
          /* 删光查询后没有任何查询可对应旧快照——必须一并清掉 c.lastPreview,
           * 否则之后再新建一个新查询时,sqlStatus 会因为 lastPreview 仍非空
           * 而直接展示那份属于旧查询的快照表格("复活"了已经不存在的数据)。 */
          c.lastPreview = null;
        } else if(c.lastPreview){
          c.configDirty = true;
        }
        rerenderCardFull(cid);
        /* item2:删光查询后 sqlStatus 会变回 unconfigured——必须走 syncCard 让右侧
         * pv-block 立刻跟着换成灰化的中性占位提示,不能继续展示已经不存在的旧表格。 */
        syncCard(cid);
        schedulePersist();
        toast('已移除查询' + (c.lastPreview ? ',请重新取数' : ''), 'info');
      }
      break;
    }
    case 'gen-script':
      /* item3:是否需要就"放弃待应用的 pending 脚本"和/或"覆盖手动修改"二次确认,
       * 统一交给 requestGenScript 判断——两类提示可能依次出现,也可能都不出现。 */
      requestGenScript(cid);
      break;
    case 'preview':
      runPreview(cid);
      break;
    case 'apply-pending-script':
      /* item3:pendingScript 不再有 focusout 自动应用的路径,点击「应用」是唯一入口;
       * 若挂起期间脚本框内已有手动修改,requestApplyPendingScript 内部会先弹确认。 */
      requestApplyPendingScript(cid);
      break;
    case 'gen-insight':
      runGenInsight(cid);
      break;
    case 'refresh-upstream':
      refreshUpstream(cid);
      break;
    case 'goto-card':
      selectCard(actEl.dataset.target, 'both');
      break;
    case 'fmt': {
      const c = findCard(cid);
      const ed = cardEl ? cardEl.querySelector('.rich-editor') : null;
      if(c && ed){
        ed.focus();
        const cmd = actEl.dataset.cmd;
        const rawVal = actEl.dataset.val || null;
        /* item9:formatBlock 的值须带尖括号(如 "<h1>")才能在 Firefox 下正确生效,
           Chrome/Safari 两种写法都接受,统一加尖括号更兼容。 */
        const val = (cmd === 'formatBlock' && rawVal) ? ('<' + rawVal + '>') : rawVal;
        document.execCommand(cmd, false, val);
        c.html = ed.innerHTML;
        const pv = $('[data-body-of="' + c.id + '"]');
        if(pv) pv.innerHTML = c.html;
        schedulePersist();
      }
      break;
    }
    case 'qm-tpl': {
      const ta = $('#qm-sql');
      const nm = $('#qm-name');
      if(ta) ta.value = actEl.dataset.tpl === 'trend' ? SQL_TPL_TREND : SQL_TPL_EVENTS;
      if(nm && !nm.value.trim()) nm.value = actEl.dataset.tpl === 'trend' ? '近7日每日事件趋势' : '本周安全事件明细';
      break;
    }
    case 'qm-save':
      saveQueryModal();
      break;
    case 'modal-cancel':
      /* item5:统一经过 requestCloseModal 判断——查询弹窗有未保存输入时,
         X/取消/遮罩/Esc 这几条"关闭"路径都先原地确认,而不是立即关掉。 */
      requestCloseModal();
      break;
    case 'qm-discard-cancel': {
      const bar = document.getElementById('qm-discard-bar');
      if(bar) bar.style.display = 'none';
      break;
    }
    case 'qm-discard-ok':
      closeModal();
      break;
    case 'confirm-ok': {
      const cb = confirmCb;
      confirmCb = null;
      closeModal();
      if(cb) cb();
      break;
    }
  }
});

/* Esc 关闭弹窗(item5:查询弹窗有未保存输入时先确认丢弃);
   Enter 提交查询弹窗(textarea 内除外,textarea 里 Enter 用于换行)。 */
document.addEventListener('keydown', e => {

/* item1(本轮根因修复):dirty/stale 这类会改变卡片高度的横幅,一旦挪到"敲完字、
 * 鼠标移向按钮、松手点击"这段时间之外的 blur/change 才出现,就会在用户鼠标已经在路上时
 * 才把按钮/下方插入「+」顶下去——这次点击的 mousedown~mouseup 之间恰好插入了一次布局
 * 变化,浏览器就不会把它合成为按钮的 click,点击被吞。根治方式:让这类横幅在 input
 * (逐击键)阶段的"第一次状态翻转"那一刻就出现,而不是等到 blur。翻转只发生一次
 * (用 changed 标志位把 dirty=false→true 的那次keystroke 之后的所有后续 keystroke 都短路掉),
 * 所以既是"实时"的,也不会每敲一下都触发一次开销较大的刷新。
 * ↑ 但 changed 只覆盖 scriptEdited/configDirty 各自"第一次翻转"这一种情形——如果两者早已
 * 翻转过(比如已过期卡),此后脚本在空↔非空之间来回编辑(如全选删除脚本变回「未配置」,
 * 再敲回内容变回「已过期/可取数」),changed 会一直是 false,badge 与运行取数按钮就会停留
 * 在旧状态,点击"重新运行取数"实际会被 runPreview 里的 unconfigured 判断静默拦下。因此额外
 * 用 c._syncedStatus(上一次真正同步到 DOM 的状态值)兜底比对,只要 sqlStatus 计算结果与
 * 缓存不同就必须 syncCard,不依赖 scriptEdited/configDirty 是否发生过翻转。 */
function applyScriptEditDirty(c){
  let changed = false;
  if(!c.scriptEdited){ c.scriptEdited = true; changed = true; }
  if(c.lastPreview && !c.configDirty){ c.configDirty = true; changed = true; }
  const nowStatus = sqlStatus(c);
  if(changed || nowStatus !== c._syncedStatus) syncCard(c.id); // 左侧横幅、右侧 pv-block(变为 stale 展示)、顶栏计数一并实时刷新
}
function applyPromptEditDirty(c, cardEl){
  /* 按钮是否可用 / 原因文案属于"每次按键都可能变"的轻量展示,始终原地刷新 */
  updateGenInsightRow(cardEl, c, insightStatus(c), canGenerateInsight(c));
  let changed = false;
  if(c.output){
    /* dirty 横幅:与上次生成时的 genPrompt 做双向比较——改回原提示词即消除提示。
       只有真正发生翻转的那一刻才做较重的 syncCard,避免每次按键都重建。 */
    const nowDirty = (c.prompt !== c.genPrompt);
    if(nowDirty !== !!c.dirty){ c.dirty = nowDirty; changed = true; }
  }
  /* 同 applyScriptEditDirty:dirty 早已是 true 时(如已经改过一次)再清空提示词,
     不会再触发一次 dirty 翻转,但 insightStatus 本身会从 stale/done 变成 unconfigured,
     徽章/横幅仍必须跟着变——用状态值比对兜底,覆盖 dirty 翻转覆盖不到的迁移。 */
  const nowStatus = insightStatus(c);
  if(changed || nowStatus !== c._syncedStatus) syncCard(c.id);
}

/* ---------- 事件委托:输入(逐击键触发) ----------
 * 把值写回 state,并按上面两个"仅在真正需要时才做较重刷新"的辅助函数,实时驱动会影响
 * 布局的横幅/徽章——因为按钮/文本框节点从未被替换,用户可以随时把焦点从一个输入框
 * 直接移到另一个输入框、或点击同一张卡里的按钮,不会丢焦点、不会丢点击。 */
const listEl = $('#card-list');
listEl.addEventListener('input', e => {
  const t = e.target;
  const cardEl = t.closest('[data-card-id]');
  if(!cardEl) return;
  const c = findCard(cardEl.dataset.cardId);
  if(!c) return;
  if(t.classList.contains('title-input')){
    c.title = t.value;
    $$('[data-title-of="' + c.id + '"]').forEach(n => { n.textContent = c.title || '未命名卡片'; });
    syncCardTitleRefs(c);
    schedulePersist(); // item4:自动保存补漏——标题此前漏了这一句,只改标题刷新后会丢
    return;
  }
  if(t.classList.contains('rich-editor')){
    c.html = t.innerHTML;
    const pv = $('[data-body-of="' + c.id + '"]');
    if(pv) pv.innerHTML = c.html;
    schedulePersist(); // item4:自动保存补漏——富文本正文此前漏了这一句,只改正文刷新后会丢
    return;
  }
  const bind = t.dataset.bind;
  if(bind){
    c[bind] = t.value;
    if(bind === 'basis') updateGenScriptRow(cardEl, c);
    if(bind === 'prompt') applyPromptEditDirty(c, cardEl);
    if(bind === 'script') applyScriptEditDirty(c);
    schedulePersist();
  }
});

/* ---------- 事件委托:变化(change,多为失焦触发) ----------
 * 会影响布局的状态翻转已经在 input 阶段原地完成,change/blur 这里只做两件轻量的事:
 * ①勾选类交互本来就是与"点击"同一次手势,天然不存在"先重排、后点偏"的时间差,继续在
 * 这里处理;②对已经在 input 阶段实时更新过的字段(脚本/提示词),blur 时只补一条一次性
 * toast 提示,不再重复任何会重排布局的 DOM 变更。 */
listEl.addEventListener('change', e => {
  const t = e.target;
  const cardEl = t.closest('[data-card-id]');
  if(!cardEl) return;
  const c = findCard(cardEl.dataset.cardId);
  if(!c) return;
  /* 洞见引用勾选:只切换这一行的 is-checked 样式 + 用统一的 syncCard 刷新本卡徽章/横幅/
     动作区 + 右侧 pv-block + 顶栏计数,不触碰引用列表其它行,不会打断连续勾选。 */
  if(t.dataset.refid){
    const rid = t.dataset.refid;
    if(t.checked){ if(!c.refIds.includes(rid)) c.refIds.push(rid); }
    else c.refIds = c.refIds.filter(x => x !== rid);
    if(c.output) c.dirty = true;
    if(c.refIds.length) c.brokenNote = '';
    const row = t.closest('.ref-item');
    if(row) row.classList.toggle('is-checked', t.checked);
    syncCard(c.id);
    schedulePersist();
    return;
  }
  /* 手动编辑脚本:state 变更与横幅/徽章/pv-block 刷新已经在 input 阶段的
     applyScriptEditDirty 里实时完成,这里只在真正离开文本框时补一条提示。 */
  if(t.dataset.bind === 'script'){
    schedulePersist();
    toast('脚本已手动修改' + (c.lastPreview ? ',取数结果已标记为需更新' : ''), 'info');
    return;
  }
  /* 提示词:dirty 状态与横幅已经在 input 阶段的 applyPromptEditDirty 里实时完成,
     这里无需任何额外 DOM 更新。 */
  if(t.dataset.bind === 'prompt') return;
  /* 脚本依据(basis)的按钮态/提示条已经在 input 阶段逐击键刷新过,此处无需任何 DOM 更新——
     从始至终都不会有任何重建发生在"点 AI 生成脚本"这次点击的 mousedown~mouseup 之间。 */
  if(t.dataset.bind === 'basis') schedulePersist();
});
/* item3(本轮):pendingScript 改为"永不自动应用"——此前脚本框 focusout(失焦)时会
 * 委托到这里静默调用 applyPendingScript,这带来两个问题:①用户可能只是临时点开别处
 * 看一眼又点回来,并无意让 AI 结果覆盖她正在看/改的脚本,却被这次失焦悄悄应用掉;
 * ②这次静默应用本身会触发 syncCard() 引发的横幅/按钮布局变化,一旦恰好发生在用户
 * 点击别处按钮的 mousedown~mouseup 之间,就会重演本文件反复强调的"点击被布局位移吞掉"
 * 问题。因此彻底删除这条 focusout 委托——pending 提示条常驻显示,只有用户显式点击
 * 「应用」(见下方 click 委托里的 'apply-pending-script' 分支)才会真正落地,应用前
 * 若脚本框内已有手动修改还会先弹确认,不会静默覆盖。 */

/* 顶栏报告名:即时同步到浏览器标签页标题与打印页眉,并纳入自动保存 */
$('#docname').addEventListener('input', e => { state.docName = e.target.value; syncDocTitle(); schedulePersist(); });

/* ---------- 悬停联动 ---------- */
function bindHover(container){
  container.addEventListener('mouseover', e => {
    if(state.mode === 'read') return;
    const el = e.target.closest('[data-card-id]');
    setHover(el ? el.dataset.cardId : null);
  });
  container.addEventListener('mouseleave', () => setHover(null));
}
bindHover(listEl);
bindHover($('#paper-scroll'));

/* item2:静态文本块支持双击→自动定位左侧对应卡并聚焦其富文本编辑区
   (右侧成品预览本身不可编辑,双击只是跳转到左侧真正可编辑的地方)。 */
$('#paper-scroll').addEventListener('dblclick', e => {
  if(state.mode === 'read') return;
  const block = e.target.closest('[data-dblclick="static"]');
  if(!block) return;
  const id = block.dataset.cardId;
  const c = findCard(id);
  if(!c) return;
  if(c.collapsed){ c.collapsed = false; rerenderCardFull(id); schedulePersist(); }
  selectCard(id, 'both');
  const ed = document.querySelector('#card-list [data-card-id="' + id + '"] .rich-editor');
  if(ed){
    ed.focus();
    const range = document.createRange();
    range.selectNodeContents(ed);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
});

/* ---------- 拖拽排序 ---------- */
let dragId = null;
listEl.addEventListener('mousedown', e => {
  const handle = e.target.closest('.drag');
  const card = e.target.closest('.cfg-card');
  if(handle && card) card.setAttribute('draggable', 'true');
});
listEl.addEventListener('dragstart', e => {
  const card = e.target.closest('.cfg-card');
  if(!card || card.getAttribute('draggable') !== 'true'){ e.preventDefault(); return; }
  dragId = card.dataset.cardId;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragId); } catch(_){ }
  setTimeout(() => card.classList.add('dragging'), 0);
});
listEl.addEventListener('dragover', e => {
  if(!dragId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  $$('.drop-before,.drop-after').forEach(n => n.classList.remove('drop-before', 'drop-after'));
  const over = e.target.closest('.cfg-card');
  if(!over || over.dataset.cardId === dragId) return;
  const rect = over.getBoundingClientRect();
  const before = e.clientY < rect.top + rect.height / 2;
  over.classList.add(before ? 'drop-before' : 'drop-after');
});
listEl.addEventListener('drop', e => {
  if(!dragId) return;
  e.preventDefault();
  const over = e.target.closest('.cfg-card');
  const from = cardIdx(dragId);
  if(from < 0){ cleanupDrag(); return; }
  let to;
  if(over && over.dataset.cardId !== dragId){
    const rect = over.getBoundingClientRect();
    const before = e.clientY < rect.top + rect.height / 2;
    to = cardIdx(over.dataset.cardId) + (before ? 0 : 1);
  } else if(!over){
    const z = e.target.closest('.ins-zone');
    const zi = z ? parseInt(z.dataset.index, 10) : NaN;
    to = isNaN(zi) ? state.cards.length : zi;
  } else {
    cleanupDrag(); return;
  }
  const moved = state.cards.splice(from, 1)[0];
  if(to > from) to--;
  state.cards.splice(to, 0, moved);
  cleanupDrag();
  renderAll();
  selectCard(moved.id, 'both');
  toast('已调整卡片顺序', 'info');
});
listEl.addEventListener('dragend', cleanupDrag);
/* 松开鼠标但未发生拖拽时,清掉临时 draggable,避免后续误拖卡片 */
document.addEventListener('mouseup', () => {
  if(!dragId) $$('.cfg-card[draggable]').forEach(n => n.removeAttribute('draggable'));
});
function cleanupDrag(){
  dragId = null;
  $$('.cfg-card').forEach(n => {
    n.classList.remove('dragging', 'drop-before', 'drop-after');
    n.removeAttribute('draggable');
  });
}

/* ---------- 初始化:优先恢复上次自动保存的内容,否则展示精心设计的空状态 ---------- */
/* item5:loadPersisted() 内部的结构校验 + 归一化已经兜住了已知的缺字段场景,这里再包一层
 * try/catch 作为最后一道防线——任何未预见的异常都不应该让用户停在白屏上。一旦触发,
 * 直接清空 state.cards、删掉持久化键(避免下次刷新又读到同一份坏数据死循环)、重新
 * renderAll() 退回空状态。finally 里无条件把 booting 复位为 false:哪怕这条路径本身
 * 也失败了,也绝不能让 booting 永远卡在 true——那样此后所有编辑都不会再写盘。 */
let restoredFromStorage = false;
try{
  restoredFromStorage = loadPersisted();
  renderAll();
} catch(err){
  state.cards = [];
  try{ localStorage.removeItem(PERSIST_KEY); } catch(e2){ /* 隐私模式等场景下静默失败 */ }
  restoredFromStorage = false;
  renderAll();
} finally {
  booting = false; // item5:初始化渲染已完成(无论成功与否),此后的 renderAll() 恢复正常写盘
}
if(restoredFromStorage){
  toast('已自动恢复上次编辑的内容(' + state.cards.length + ' 张卡片)', 'info');
  /* item3:恢复内容里若清洗出了残留的"取数中/生成中"等中断态,额外告知用户已重置,
     避免她盯着一个看起来卡住但其实需要重新点一次的按钮摸不着头脑。 */
  if(restoredFromStorage === 'stuck'){
    toast('检测到刷新前有未完成的取数/生成操作,已重置为可重新操作的状态', 'warning');
  }
}
</script>
</body>
